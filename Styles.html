<!-- ================= CDN LIBRARIES & GLOBAL STYLES ================= -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  .hidden {
    display: none !important;
  }

  .sticky-th,
  .sticky-th th,
  th.sticky-th {
    position: sticky !important;
    top: 0 !important;
    background-color: #f8fafc !important;
    z-index: 20 !important;
    box-shadow: 0 1px 0 #cbd5e1;
  }

  .safe-area-bottom {
    padding-bottom: calc(0.375rem + env(safe-area-inset-bottom, 0px));
  }

  /* Responsive Visibility Helpers (Mobile < 768px vs Desktop >= 768px) */
  @media (max-width: 767px) {
    .mobile-hide {
      display: none !important;
    }
  }

  @media (min-width: 768px) {
    .desktop-hide {
      display: none !important;
    }
  }

  body {
    font-family: 'Inter', sans-serif;
  }

  /* Official Dinas Document Page Styling */
  .doc-page {
    font-family: 'Bookman Old Style', 'Georgia', 'Times New Roman', serif;
    background: #ffffff;
    color: #000000;
    line-height: 1.35;
    font-size: 11.5pt;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
  }

  /* Paper size standard Indonesian Folio / F4 (215mm x 330mm) */
  .paper-f4 {
    width: 215mm;
    min-height: 330mm;
    padding: 15mm 20mm 20mm 25mm;
  }

  /* Paper size standard International A4 (210mm x 297mm) */
  .paper-a4 {
    width: 210mm;
    min-height: 297mm;
    padding: 15mm 20mm 20mm 25mm;
  }

  .page-break-divider {
    position: relative;
    margin: 40px 0;
    border-top: 2px dashed #94a3b8;
    text-align: center;
  }

  .page-break-divider::after {
    content: '— BATAS HALAMAN 1 (SURAT) DAN HALAMAN 2 (LAMPIRAN) —';
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    background: #f1f5f9;
    padding: 0 16px;
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    font-family: 'Inter', sans-serif;
  }

  /* WYSIWYG Editor Canvas Styling */
  #wysiwygEditor {
    font-family: 'Bookman Old Style', 'Georgia', 'Times New Roman', serif;
    font-size: 11.5pt;
    line-height: 1.4;
    color: #000000;
    outline: none;
  }

  #wysiwygEditor p {
    margin-bottom: 8px;
  }

  #wysiwygEditor ol,
  #wysiwygEditor ul {
    margin-left: 20px;
    margin-bottom: 10px;
  }

  #wysiwygEditor ol {
    list-style-type: decimal;
  }

  #wysiwygEditor ul {
    list-style-type: disc;
  }

  /* Print Stylesheet */
  @media print {
    @page {
      size: 215mm 330mm;
      margin: 12mm 15mm 15mm 20mm;
    }

    html,
    body {
      background: #ffffff !important;
      color: #000000 !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      height: auto !important;
    }

    /* Sembunyikan navigator scroll bar browser saat cetak */
    * {
      overflow: visible !important;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .overflow-x-auto,
    .overflow-y-auto,
    .overflow-auto {
      overflow: visible !important;
    }

    main,
    #mainLayoutContainer {
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    #mainDocumentPreviewArea {
      display: block !important;
      overflow: visible !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
    }

    #mainDocumentPreviewArea>div:not(.no-print) {
      display: block !important;
      overflow: visible !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
    }

    .no-print,
    .no-print *,
    #docPreviewToolbar,
    #mainDocumentPreviewArea>.no-print,
    #mainDocumentPreviewArea .no-print,
    header,
    nav,
    aside {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    .doc-page {
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: auto !important;
      border: none !important;
    }

    .page-break-divider {
      display: none !important;
    }

    .print-page-break {
      page-break-before: always !important;
      break-before: page !important;
    }

    .batch-doc-page {
      page-break-after: always !important;
      break-after: page !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      height: auto !important;
      min-height: auto !important;
    }

    .batch-doc-page:last-child {
      page-break-after: auto !important;
      break-after: auto !important;
    }

    body.batch-print-active main,
    body.batch-print-active #mainDocumentPreviewArea {
      display: none !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    body.batch-print-active > *:not(#batchPrintContainer) {
      display: none !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    body.batch-print-active #batchPrintContainer {
      display: block !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Khusus tabel Lampiran Daftar Siswa agar tidak terpotong border kanannya */
    .lampiran-page {
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .lampiran-table,
    .lampiran-page table {
      width: 99.6% !important;
      max-width: 99.6% !important;
      table-layout: fixed !important;
      border-collapse: collapse !important;
      box-sizing: border-box !important;
      margin-left: 0 !important;
      margin-right: auto !important;
    }

    .lampiran-page table th,
    .lampiran-page table td,
    .lampiran-table th,
    .lampiran-table td {
      border: 1px solid #000000 !important;
      box-sizing: border-box !important;
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
    }

    .lampiran-page table th:last-child,
    .lampiran-page table td:last-child,
    .lampiran-table th:last-child,
    .lampiran-table td:last-child {
      border-right: 1.5px solid #000000 !important;
    }
  }

  #batchPrintContainer {
    display: none;
  }

  /* Mobile horizontal scroll helper */
  .scrollbar-none::-webkit-scrollbar {
    display: none;
  }

  .scrollbar-none {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
<style id="dynamicPrintPageStyle">
  @media print {
    @page {
      size: 215mm 330mm;
      margin: 12mm 15mm 15mm 20mm;
    }
  }
</style>
