<!-- ================= TOP HEADER NAVIGATION ================= -->
<header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-indigo-900 text-white shadow-lg sticky top-0 z-30 no-print border-b border-indigo-800/40">
  <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-2.5 sm:py-3 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3">
    
    <!-- Brand & School Info -->
    <div class="flex items-center justify-between lg:justify-start gap-3">
      <div class="flex items-center gap-3 cursor-pointer select-none" onclick="navigateTo('surat')">
        <div id="headerBrandLogoWrapper" class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-400/30 flex items-center justify-center text-indigo-300 shadow-inner overflow-hidden flex-shrink-0 transition-transform hover:scale-105">
          <i id="defaultBrandIcon" data-lucide="file-badge" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">Aplikasi Surat PKL</h1>
            <button type="button" onclick="openChangelogModal()" class="text-[10px] font-semibold bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-400/40 hover:border-emerald-300 px-2 py-0.5 rounded-full flex items-center gap-1.5 cursor-pointer transition shadow-xs group" title="Klik untuk melihat catatan rilis & pembaruan versi">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>v2.4.0</span>
              <i data-lucide="sparkles" class="w-3 h-3 text-emerald-300/80 group-hover:text-emerald-100 transition-transform group-hover:scale-110"></i>
            </button>
          </div>
          <p id="headerSchoolSubtitle" class="text-xs text-indigo-200/80 truncate max-w-[280px] sm:max-w-md">SMK Negeri 1 Klungkung • Tahun Ajaran 2026/2027</p>
        </div>
      </div>

      <!-- Mobile Quick Menu Trigger -->
      <div class="flex lg:hidden items-center gap-1">
        <button type="button" onclick="refreshDataFromSheets()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white" title="Muat Ulang Data">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Main Navigation Menus & Toolbar -->
    <div class="flex items-center justify-between lg:justify-end gap-1.5 sm:gap-2 w-full lg:w-auto overflow-x-auto pb-1 lg:pb-0 scrollbar-none">
      
      <!-- NAV TABS (DESKTOP & TABLET) -->
      <nav class="flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-indigo-800/40 mr-1 flex-shrink-0">
        <!-- 1. Halaman Surat (Dashboard) -->
        <button onclick="navigateTo('surat')" id="navTabSurat" class="nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-300 hover:text-white hover:bg-white/10" title="Halaman Utama Pembuatan Surat">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>Surat</span>
        </button>

        <!-- 2. Halaman Database Siswa -->
        <button onclick="navigateTo('database')" id="navTabDatabase" class="nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-300 hover:text-white hover:bg-white/10" title="Database Siswa PKL (Google Sheets)">
          <i data-lucide="database" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>Database</span>
        </button>

        <!-- 3. Halaman Template WYSIWYG -->
        <button onclick="navigateTo('template')" id="navTabTemplate" class="nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-300 hover:text-white hover:bg-white/10" title="Template Surat & WYSIWYG Editor">
          <i data-lucide="layout-template" class="w-3.5 h-3.5 text-amber-400"></i>
          <span>Template</span>
        </button>

        <!-- 4. Halaman Pengaturan -->
        <button onclick="navigateTo('pengaturan')" id="navTabPengaturan" class="nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-300 hover:text-white hover:bg-white/10" title="Pengaturan Identitas, Kop & TTD">
          <i data-lucide="settings" class="w-3.5 h-3.5 text-violet-400"></i>
          <span>Pengaturan</span>
        </button>
      </nav>

      <!-- ACTION BUTTONS -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <!-- Simpan ke Google Drive -->
        <button onclick="saveCurrentDocToDrive()" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold px-2.5 py-1.5 rounded-lg text-xs transition shadow-xs whitespace-nowrap cursor-pointer" title="Simpan Dokumen Aktif ke Google Drive">
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5 text-blue-100 flex-shrink-0"></i>
          <span class="hidden sm:inline">Drive</span>
        </button>

        <!-- Cetak Dokumen Dropdown -->
        <div class="relative inline-block text-left" id="dropdownCetakWrapper">
          <button onclick="toggleDropdown('dropdownCetakMenu')" class="inline-flex items-center gap-1 bg-indigo-700 hover:bg-indigo-600 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition shadow-xs whitespace-nowrap cursor-pointer" title="Cetak Dokumen">
            <i data-lucide="printer" class="w-3.5 h-3.5 text-indigo-200 flex-shrink-0"></i>
            <span>Cetak</span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-80 flex-shrink-0"></i>
          </button>
          <div id="dropdownCetakMenu" class="dropdown-menu-list hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-2xl border border-slate-200 py-1.5 z-50 text-slate-700 animate-in fade-in slide-in-from-top-1 duration-150">
            <button onclick="printCurrentDoc(); closeAllDropdowns();" class="w-full text-left px-3.5 py-2 text-xs hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2.5 transition">
              <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i>
              <div>
                <div class="font-semibold text-slate-800">Cetak Surat Ini</div>
                <div class="text-[10px] text-slate-400">Cetak 1 berkas yang aktif</div>
              </div>
            </button>
            <div class="border-t border-slate-100 my-1"></div>
            <button onclick="openBatchPrintModal(); closeAllDropdowns();" class="w-full text-left px-3.5 py-2 text-xs hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2.5 transition">
              <i data-lucide="copy" class="w-4 h-4 text-amber-500"></i>
              <div>
                <div class="font-semibold text-slate-800">Cetak Massal (Batch)</div>
                <div class="text-[10px] text-slate-400">Pilih & cetak banyak surat sekaligus</div>
              </div>
            </button>
          </div>
        </div>

        <!-- Unduh Dokumen Dropdown -->
        <div class="relative inline-block text-left" id="dropdownUnduhWrapper">
          <button onclick="toggleDropdown('dropdownUnduhMenu')" class="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition shadow-xs whitespace-nowrap cursor-pointer" title="Unduh Dokumen">
            <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-100 flex-shrink-0"></i>
            <span>Unduh</span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-80 flex-shrink-0"></i>
          </button>
          <div id="dropdownUnduhMenu" class="dropdown-menu-list hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-2xl border border-slate-200 py-1.5 z-50 text-slate-700 animate-in fade-in slide-in-from-top-1 duration-150">
            <button onclick="downloadDocxClient(); closeAllDropdowns();" class="w-full text-left px-3.5 py-2 text-xs hover:bg-emerald-50 hover:text-emerald-700 flex items-center gap-2.5 transition">
              <i data-lucide="file-type-2" class="w-4 h-4 text-emerald-600"></i>
              <div>
                <div class="font-semibold text-slate-800">Unduh Word (.DOCX)</div>
                <div class="text-[10px] text-slate-400">Berkas Word untuk surat aktif</div>
              </div>
            </button>
            <div class="border-t border-slate-100 my-1"></div>
            <button onclick="downloadAllWordZip(); closeAllDropdowns();" class="w-full text-left px-3.5 py-2 text-xs hover:bg-emerald-50 hover:text-emerald-700 flex items-center gap-2.5 transition">
              <i data-lucide="archive" class="w-4 h-4 text-emerald-600"></i>
              <div>
                <div class="font-semibold text-slate-800">Unduh Semua Word (.ZIP)</div>
                <div class="text-[10px] text-slate-400">Arsip ZIP seluruh surat dinas</div>
              </div>
            </button>
          </div>
        </div>

        <!-- Refresh Button -->
        <button type="button" onclick="refreshDataFromSheets()" class="hidden lg:flex flex-none items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 p-2 rounded-lg transition shadow-xs cursor-pointer" title="Muat Ulang Data dari Spreadsheet">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </div>
</header>

<!-- ================= MOBILE BOTTOM NAVIGATION BAR ================= -->
<nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-40 px-2 py-1 flex items-center justify-around text-slate-300 shadow-2xl no-print">
  <button onclick="navigateTo('surat')" id="mobileNavSurat" class="flex-1 py-1.5 px-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition">
    <i data-lucide="file-text" class="w-4 h-4"></i>
    <span class="text-[10px] font-medium leading-tight">Surat</span>
  </button>
  <button onclick="navigateTo('database')" id="mobileNavDatabase" class="flex-1 py-1.5 px-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition">
    <i data-lucide="database" class="w-4 h-4"></i>
    <span class="text-[10px] font-medium leading-tight">Data</span>
  </button>
  <button onclick="navigateTo('template')" id="mobileNavTemplate" class="flex-1 py-1.5 px-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition">
    <i data-lucide="layout-template" class="w-4 h-4"></i>
    <span class="text-[10px] font-medium leading-tight">Template</span>
  </button>
  <button onclick="navigateTo('pengaturan')" id="mobileNavPengaturan" class="flex-1 py-1.5 px-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-white transition">
    <i data-lucide="settings" class="w-4 h-4"></i>
    <span class="text-[10px] font-medium leading-tight">Setting</span>
  </button>
  <button onclick="openBatchPrintModal()" class="flex-1 py-1.5 px-1 flex flex-col items-center justify-center gap-1 text-amber-400 hover:text-amber-300 transition">
    <i data-lucide="printer" class="w-4 h-4"></i>
    <span class="text-[10px] font-semibold leading-tight">Cetak</span>
  </button>
</nav>
