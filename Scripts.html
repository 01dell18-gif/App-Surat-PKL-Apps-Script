// Mengubah URL Google Drive biasa menjadi tautan thumbnail langsung agar dapat tampil di tag <img>
function getDirectImageUrl(url, fallback) {
  if (!url || typeof url !== 'string') return fallback || '';
  const trimmed = url.trim();
  if (!trimmed) return fallback || '';
  if (trimmed.startsWith('data:image/')) return trimmed;

  const driveMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                     trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
                     trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch && driveMatch[1]) {
    return 'https://drive.google.com/thumbnail?id=' + driveMatch[1] + '&sz=w1200';
  }
  return trimmed;
}

// Helper membersihkan nilai data kosong / null / spasi menjadi '-'
function cleanFieldValue(val, defaultVal = '-') {
  if (val === null || val === undefined) return defaultVal;
  const str = String(val).trim();
  if (!str || str.toLowerCase() === 'null' || str.toLowerCase() === 'undefined') return defaultVal;
  return str;
}

// Helper menyelaraskan template bawaan agar selalu menyertakan placeholder terbaru
function mergeDefaultTemplates(loadedList) {
  if (!Array.isArray(loadedList) || loadedList.length === 0) {
    return JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
  }
  const defaultMap = {};
  DEFAULT_TEMPLATES.forEach(dt => { defaultMap[dt.id] = dt; });

  const result = loadedList.map(t => {
    const dt = defaultMap[t.id];
    if (dt && t.id.startsWith('tpl_') && (!t.html_content || !t.html_content.includes('{guruPangkat}'))) {
      return { ...dt, ...t, html_content: dt.html_content };
    }
    return t;
  });

  const existingIds = result.map(t => t.id);
  DEFAULT_TEMPLATES.forEach(dt => {
    if (!existingIds.includes(dt.id)) {
      result.push(JSON.parse(JSON.stringify(dt)));
    }
  });

  return result;
}

// ================= FORMAT TANGGAL INDONESIA (dd MMMM yyyy) =================
const INDONESIA_MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

function formatIndonesianDate(val) {
  if (!val) return '';
  if (typeof val === 'string') {
    val = val.trim();
    // Jika sudah berupa dd MMMM yyyy (misal "13 November 2026" atau "06 Oktober 2026")
    const idRegex = /^\d{1,2}\s+(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+\d{4}$/i;
    if (idRegex.test(val)) return val;
    // Jika berupa rentang teks (misal "13 November 2026 sampai dengan 30 April 2027")
    if (val.toLowerCase().includes('sampai') || val.includes(' s/d ') || val.includes(' - ')) return val;
  }

  let d;
  if (val instanceof Date) {
    d = val;
  } else if (typeof val === 'string') {
    if (val.match(/^\d{4}-\d{2}-\d{2}/)) {
      d = new Date(val);
    } else {
      const parsed = Date.parse(val);
      if (!isNaN(parsed)) d = new Date(parsed);
      else return val;
    }
  } else {
    return String(val);
  }

  if (isNaN(d.getTime())) return String(val);
  const day = String(d.getDate()).padStart(2, '0');
  const month = INDONESIA_MONTHS[d.getMonth()];
  const year = d.getFullYear();
  return `${day} ${month} ${year}`;
}

// Helper mendeteksi apakah template menggunakan Lembar ke-2 (Lampiran)
function isTemplateUsingLampiran(activeTemplate, studentList) {
  if (!studentList || studentList.length === 0) return false;
  if (!activeTemplate) return false;

  const tplId = activeTemplate.id || '';
  const tplName = (activeTemplate.nama || '').toLowerCase();
  const rawHtml = activeTemplate.html_content || '';

  // Surat Keterangan PKL dan Suket Monitoring tidak menggunakan lampiran (dokumen tugas/individual 1 lembar)
  if (tplId === 'tpl_surat_keterangan_pkl' || tplId === 'tpl_suket_monitoring_pkl' || tplName.includes('keterangan') || tplName.includes('monitoring') || tplName.includes('tugas')) {
    return false;
  }

  // Jika badan surat sudah mengandung placeholder tabel siswa, tabel dicetak langsung di Lembar 1
  if (rawHtml.includes('{tabelSiswaPermohonan}')) {
    return false;
  }

  // Template lainnya (Surat Pengantar, PKL Terpadu, atau template kustom) mencantumkan rincian siswa di Lembar 2 (Lampiran)
  return true;
}

// ================= MODERN MINIMALIST NOTIFICATION & POPUP SYSTEM =================
function showToast(msg, type = 'info', title = '', duration = 3200) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'pointer-events-auto flex items-start gap-2.5 p-3 rounded-xl shadow-2xl border backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 text-xs cursor-pointer select-none';

  let iconName = 'info';
  let bgClass = 'bg-slate-900/95 border-slate-700/80 text-white';
  let iconBg = 'bg-sky-500/20 text-sky-400';
  let defaultTitle = 'Informasi';

  if (type === 'success') {
    iconName = 'check-circle';
    iconBg = 'bg-emerald-500/20 text-emerald-400';
    defaultTitle = title || 'Berhasil';
  } else if (type === 'error') {
    iconName = 'alert-circle';
    iconBg = 'bg-rose-500/20 text-rose-400';
    defaultTitle = title || 'Gagal';
  } else if (type === 'warning') {
    iconName = 'alert-triangle';
    iconBg = 'bg-amber-500/20 text-amber-400';
    defaultTitle = title || 'Perhatian';
  } else {
    defaultTitle = title || 'Pemberitahuan';
  }

  toast.className += ' ' + bgClass;
  toast.innerHTML = `
    <div class="w-6 h-6 rounded-lg ${iconBg} flex items-center justify-center flex-shrink-0 mt-0.5">
      <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
    </div>
    <div class="flex-1 min-w-0 pr-1">
      <div class="font-bold text-[11px] leading-tight text-slate-200 mb-0.5">${defaultTitle}</div>
      <div class="text-[11.5px] text-slate-300 leading-snug break-words">${msg}</div>
    </div>
    <button class="text-slate-400 hover:text-white p-0.5 ml-1 flex-shrink-0" onclick="this.parentElement.remove()">
      <i data-lucide="x" class="w-3.5 h-3.5"></i>
    </button>
  `;

  container.appendChild(toast);
  if (window.lucide) lucide.createIcons({ root: toast });

  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
  });

  const timer = setTimeout(() => {
    toast.classList.remove('translate-y-0', 'opacity-100');
    toast.classList.add('-translate-y-2', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  }, duration);

  toast.onclick = function() {
    clearTimeout(timer);
    toast.classList.remove('translate-y-0', 'opacity-100');
    toast.classList.add('-translate-y-2', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  };
}

// Override default window.alert with modern minimalist toast popup
window.alert = function(msg) {
  let type = 'info';
  const str = String(msg || '');
  const lower = str.toLowerCase();
  if (lower.includes('berhasil') || lower.includes('sukses')) type = 'success';
  else if (lower.includes('gagal') || lower.includes('error') || lower.includes('kesalahan')) type = 'error';
  else if (lower.includes('harap') || lower.includes('peringatan') || lower.includes('pastikan') || lower.includes('tidak')) type = 'warning';
  showToast(str, type);
};

// Modern Minimalist Confirmation Dialog
function showModernConfirm({ title = 'Konfirmasi', message = 'Lanjutkan tindakan ini?', okText = 'Lanjutkan', cancelText = 'Batal', type = 'danger', onConfirm }) {
  const modal = document.getElementById('modernConfirmModal');
  if (!modal) {
    if (confirm(message)) onConfirm();
    return;
  }
  document.getElementById('confirmModalTitle').textContent = title;
  document.getElementById('confirmModalMessage').textContent = message;

  const iconWrap = document.getElementById('confirmModalIconWrap');
  const icon = document.getElementById('confirmModalIcon');
  const okBtn = document.getElementById('confirmModalOkBtn');
  const cancelBtn = document.getElementById('confirmModalCancelBtn');

  okBtn.textContent = okText;
  cancelBtn.textContent = cancelText;

  if (type === 'danger') {
    iconWrap.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center bg-rose-100 text-rose-600';
    icon.setAttribute('data-lucide', 'trash-2');
    okBtn.className = 'flex-1 py-2 px-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition shadow-sm';
  } else {
    iconWrap.className = 'w-12 h-12 rounded-full mx-auto flex items-center justify-center bg-indigo-100 text-indigo-600';
    icon.setAttribute('data-lucide', 'help-circle');
    okBtn.className = 'flex-1 py-2 px-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition shadow-sm';
  }
  if (window.lucide) lucide.createIcons({ root: iconWrap });

  modal.classList.remove('hidden');

  const cleanup = () => {
    modal.classList.add('hidden');
    okBtn.onclick = null;
    cancelBtn.onclick = null;
  };

  okBtn.onclick = () => {
    cleanup();
    if (typeof onConfirm === 'function') onConfirm();
  };

  cancelBtn.onclick = () => {
    cleanup();
  };
}

function closeModernConfirmModal() {
  const modal = document.getElementById('modernConfirmModal');
  if (modal) modal.classList.add('hidden');
}

// Sinkronisasi data template ke localStorage
function syncTemplatesCache(templates) {
  try {
    const cached = localStorage.getItem('surat_pkl_cached_data');
    if (cached) {
      const parsed = JSON.parse(cached);
      parsed.templates = templates;
      localStorage.setItem('surat_pkl_cached_data', JSON.stringify(parsed));
    }
    localStorage.setItem('surat_pkl_saved_templates', JSON.stringify(templates));
  } catch(e) {}
}

  AppState.activeTemplateId = tplId;

  } catch(e) {}

function initApp() {
  if (window.lucide) lucide.createIcons();

  // Otomatis aktifkan mode Fit Layar jika dibuka pada perangkat mobile (< 768px)
  if (window.innerWidth < 768) {
    AppState.isDocFitActive = true;
  }

  // Optimistic fast render from localStorage cache
  try {
    const cached = localStorage.getItem('surat_pkl_cached_data');
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.success) {
        onInitialDataLoaded(parsed, true);
      }
    }
  } catch(e) {}

  // Muat data dari Google Apps Script / Google Sheets
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        onInitialDataLoaded(res, false);
      })
      .withFailureHandler(onInitialDataFailed)
      .getInitialData();
  } else {
    // Mode Fallback jika dijalankan tanpa server Apps Script
    loadFallbackData();
  }
}

function onInitialDataLoaded(res, fromCache = false) {
  if (res && res.success) {
    if (!fromCache) {
      try {
        localStorage.setItem('surat_pkl_cached_data', JSON.stringify(res));
      } catch(e) {}
    }
    AppState.records = res.students || [];
    AppState.settings = res.settings || {};
    AppState.spreadsheetUrl = res.spreadsheetUrl || (res.settings && res.settings.spreadsheetUrl) || '';
    AppState.driveFolderUrl = res.driveFolderUrl || (res.settings && res.settings.driveFolderUrl) || '';
    AppState.webAppUrl = res.webAppUrl || (res.settings && res.settings.webAppUrl) || '';
    
    // Pastikan template dari database selalu dipertahankan dan diselaraskan
    const loadedTemplates = res.templates || [];
    AppState.templates = mergeDefaultTemplates(loadedTemplates);

    syncTemplatesCache(AppState.templates);

    // Pastikan default URL selalu terisi
    if (!AppState.settings.kopUrl || !AppState.settings.kopUrl.trim()) {
      AppState.settings.kopUrl = DEFAULT_ASSET_URLS.kop;
    }
    if (!AppState.settings.ttdUrl || !AppState.settings.ttdUrl.trim()) {
      AppState.settings.ttdUrl = DEFAULT_ASSET_URLS.ttd;
    }
    if (!AppState.settings.ttdBasahUrl || !AppState.settings.ttdBasahUrl.trim()) {
      AppState.settings.ttdBasahUrl = DEFAULT_ASSET_URLS.ttd_basah;
    }
    if (!AppState.settings.logoWebUrl || !AppState.settings.logoWebUrl.trim()) {
      AppState.settings.logoWebUrl = DEFAULT_ASSET_URLS.logo;
    }

    if (AppState.settings.tglSurat) AppState.settings.tglSurat = formatIndonesianDate(AppState.settings.tglSurat);
    if (AppState.settings.tglPelepasan) AppState.settings.tglPelepasan = formatIndonesianDate(AppState.settings.tglPelepasan);
    if (AppState.settings.tglPenarikan) AppState.settings.tglPenarikan = formatIndonesianDate(AppState.settings.tglPenarikan);

    // Pilih template: prioritaskan template yang sebelumnya aktif / dipilih pengguna
    const savedActiveId = localStorage.getItem('surat_pkl_active_template_id');
    if (savedActiveId && AppState.templates.some(t => t.id === savedActiveId)) {
      AppState.activeTemplateId = savedActiveId;
      AppState.editingTemplateId = savedActiveId;
    } else if (AppState.templates.length > 0) {
      const def = AppState.templates.find(t => t.is_default == 1) || AppState.templates[0];
      AppState.activeTemplateId = def.id;
      AppState.editingTemplateId = def.id;
    }

    processDataset();
    populateSettingsInputs();
    renderAll();
  } else {
    loadFallbackData();
  }
}

  console.warn('Gagal memuat data dari Apps Script, menggunakan data cadangan:', err);
  loadFallbackData();
}

// Mengolah dataset menjadi daftar Guru dan Tempat DU/DI yang terkelompok
function processDataset() {
  const guruMap = {};
  const placeMap = {};

  AppState.records.forEach((r, idx) => {
    // Guru
    const gName = r.guru || 'Tanpa Pembimbing';
    if (!guruMap[gName]) {
      guruMap[gName] = { guru: gName, nip: r.nip || '', siswa: [] };
    }
    guruMap[gName].siswa.push(r);

    // Tempat
    const pName = r.tempat || 'Tanpa Tempat';
    if (!placeMap[pName]) {
      placeMap[pName] = { tempat: pName, alamat: r.alamat || '', siswa: [] };
    }
    placeMap[pName].siswa.push(r);
  });

  AppState.gurus = Object.values(guruMap);
  AppState.places = Object.values(placeMap);

  // Update statistik jika elemen tersedia
  const sEl = document.getElementById('statTotalSiswa'); if (sEl) sEl.textContent = AppState.records.length;
  const gEl = document.getElementById('statTotalGuru'); if (gEl) gEl.textContent = AppState.gurus.length;
  const dEl = document.getElementById('statTotalDuDi'); if (dEl) dEl.textContent = AppState.places.length;
}

    try {
      populateEditorTemplateSelect();
      loadTemplateToEditor(AppState.editingTemplateId || AppState.activeTemplateId);

  }
  if (document.getElementById('templateTableBody')) {
    try { renderTemplateTableList(); } catch (e) { console.warn('renderTemplateTableList error:', e); }

  }
}

// Render Dropdown Kontrol Sidebar
function renderSidebarControls() {
  // 1. Dropdown Guru
  const guruSelect = document.getElementById('guruSelect');
  if (guruSelect) {
    guruSelect.innerHTML = AppState.gurus.map((g, idx) => 
      `<option value="${idx}" ${idx === AppState.selectedGuruIdx ? 'selected' : ''}>${g.guru} (${g.siswa.length} Siswa)</option>`
    ).join('');
  }

  // Filter Tempat PKL pada panel guru
  const tempatFilterSelect = document.getElementById('tempatFilterSelect');
  if (tempatFilterSelect) {
    const curGuru = AppState.gurus[AppState.selectedGuruIdx];
    const places = curGuru ? Array.from(new Set(curGuru.siswa.map(s => s.tempat))) : [];
    tempatFilterSelect.innerHTML = `<option value="all">-- Semua Tempat PKL (${places.length} Lokasi) --</option>` +
      places.map(p => `<option value="${p}" ${p === AppState.selectedTempatFilter ? 'selected' : ''}>${p}</option>`).join('');
  }

  // Filter Siswa pada panel guru
  const siswaFilterSelectPerGuru = document.getElementById('siswaFilterSelectPerGuru');
  if (siswaFilterSelectPerGuru) {
    const curGuru = AppState.gurus[AppState.selectedGuruIdx];
    let students = curGuru ? curGuru.siswa : [];
    if (AppState.selectedTempatFilter !== 'all') {
      students = students.filter(s => s.tempat === AppState.selectedTempatFilter);
    }
    siswaFilterSelectPerGuru.innerHTML = `<option value="all">-- Semua Siswa (${students.length} Orang) --</option>` +
      students.map(s => `<option value="${s.siswa}" ${s.siswa === AppState.selectedSiswaFilterPerGuru ? 'selected' : ''}>${s.siswa} (${s.kelas})</option>`).join('');
  }

  // 2. Dropdown DU/DI
  const dudiSelect = document.getElementById('dudiSelect');
  if (dudiSelect) {
    dudiSelect.innerHTML = AppState.places.map((p, idx) => 
      `<option value="${idx}" ${idx === AppState.selectedDuDiIdx ? 'selected' : ''}>${p.tempat} (${p.siswa.length} Siswa)</option>`
    ).join('');
  }

  const siswaFilterSelectPerDuDi = document.getElementById('siswaFilterSelectPerDuDi');
  if (siswaFilterSelectPerDuDi) {
    const curPlace = AppState.places[AppState.selectedDuDiIdx];
    const students = curPlace ? curPlace.siswa : [];
    siswaFilterSelectPerDuDi.innerHTML = `<option value="all">-- Semua Siswa (${students.length} Orang) --</option>` +
      students.map(s => `<option value="${s.siswa}" ${s.siswa === AppState.selectedSiswaFilterPerDuDi ? 'selected' : ''}>${s.siswa} (${s.kelas})</option>`).join('');
  }

  // 3. Dropdown Siswa
  const siswaSelect = document.getElementById('siswaSelect');
  if (siswaSelect) {
    siswaSelect.innerHTML = AppState.records.map((s, idx) => 
      `<option value="${idx}" ${idx === AppState.selectedSiswaIdx ? 'selected' : ''}>${s.siswa} - ${s.kelas} (${s.tempat})</option>`
    ).join('');
  }

  // 4. Dropdown Template di Sidebar
  const sidebarTemplateSelect = document.getElementById('sidebarTemplateSelect');
  if (sidebarTemplateSelect) {
    sidebarTemplateSelect.innerHTML = AppState.templates.map(t => 
      `<option value="${t.id}" ${t.id === AppState.activeTemplateId ? 'selected' : ''}>${t.nama}</option>`
    ).join('');
  }

  // Info Card Summary
  updateInfoCard();
}

function updateInfoCard() {
  const infoJumlahSiswa = document.getElementById('infoJumlahSiswa');
  const infoGuruNama = document.getElementById('infoGuruNama');
  const infoNip = document.getElementById('infoNip');
  const infoTempatTujuan = document.getElementById('infoTempatTujuan');

  // Jika tidak berada di halaman Surat (misal di Database atau Template), lewati tanpa eror
  if (!infoGuruNama && !infoJumlahSiswa && !infoTempatTujuan) return;

  let activeStudents = getActiveFilteredStudents();
  if (infoJumlahSiswa) infoJumlahSiswa.textContent = activeStudents.length;

  if (AppState.selectedMode === 'per-guru') {
    const curGuru = AppState.gurus[AppState.selectedGuruIdx];
    if (curGuru) {
      if (infoGuruNama) infoGuruNama.textContent = curGuru.guru;
      if (infoNip) infoNip.textContent = cleanFieldValue(curGuru.nip, '-');
      const tempatList = Array.from(new Set(activeStudents.map(s => s.tempat)));
      if (infoTempatTujuan) infoTempatTujuan.textContent = tempatList.length === 1 ? tempatList[0] : `${tempatList.length} Tempat DU/DI Berbeda`;
    }
  } else if (AppState.selectedMode === 'per-du-di') {
    const curPlace = AppState.places[AppState.selectedDuDiIdx];
    if (curPlace) {
      if (infoGuruNama) infoGuruNama.textContent = Array.from(new Set(activeStudents.map(s => s.guru))).join(', ') || '-';
      if (infoNip) infoNip.textContent = '-';
      if (infoTempatTujuan) infoTempatTujuan.textContent = curPlace.tempat;
    }
  } else {
    const curSiswa = AppState.records[AppState.selectedSiswaIdx];
    if (curSiswa) {
      if (infoGuruNama) infoGuruNama.textContent = curSiswa.guru;
      if (infoNip) infoNip.textContent = cleanFieldValue(curSiswa.nip, '-');
      if (infoTempatTujuan) infoTempatTujuan.textContent = curSiswa.tempat;
    }
  }
}

// Mendapatkan daftar siswa aktif sesuai mode dan filter saat ini
function getActiveFilteredStudents() {
  if (AppState.selectedMode === 'per-guru') {
    const curGuru = AppState.gurus[AppState.selectedGuruIdx];
    if (!curGuru) return AppState.records;
    let list = curGuru.siswa;
    if (AppState.selectedTempatFilter !== 'all') {
      list = list.filter(s => s.tempat === AppState.selectedTempatFilter);
    }
    if (AppState.selectedSiswaFilterPerGuru !== 'all') {
      list = list.filter(s => s.siswa === AppState.selectedSiswaFilterPerGuru);
    }
    return list;
  } else if (AppState.selectedMode === 'per-du-di') {
    const curPlace = AppState.places[AppState.selectedDuDiIdx];
    if (!curPlace) return AppState.records;
    let list = curPlace.siswa;
    if (AppState.selectedSiswaFilterPerDuDi !== 'all') {
      list = list.filter(s => s.siswa === AppState.selectedSiswaFilterPerDuDi);
    }
    return list;
  } else {
    const curSiswa = AppState.records[AppState.selectedSiswaIdx];
    return curSiswa ? [curSiswa] : [];
  }
}

// Render Pratinjau Dokumen Nyata (WYSIWYG Live Canvas)
function renderDocumentPreview() {
  const activeStudents = getActiveFilteredStudents();
  const firstStudent = activeStudents[0] || {};
  const s = AppState.settings;

  // Ukuran Kertas
  const docContainer = document.getElementById('documentTemplate');
  if (docContainer) {
    docContainer.className = `doc-page paper-${AppState.paperSize} shrink-0 shadow-lg`;
  }

  // 1. Kop Surat
  const kopContainer = document.getElementById('docKopContainer');
  if (kopContainer) {
    if (AppState.showKop) {
      const rawKop = s.kopUrl || DEFAULT_ASSET_URLS.kop;
      const kopSrc = getDirectImageUrl(rawKop, typeof ASSETS !== 'undefined' ? ASSETS.kopFyj : '');
      kopContainer.innerHTML = kopSrc ? `<img src="${kopSrc}" alt="Kop Surat" style="width: 100%; max-height: 120px; object-fit: contain; margin-bottom: 8px;">` : '';
      kopContainer.style.display = 'block';
    } else {
      kopContainer.innerHTML = '';
      kopContainer.style.display = 'none';
    }
  }

  // 2. Judul & Nomor Surat
  const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};
  let rawHtml = activeTemplate.html_content || '<p>Redaksi template belum disetel.</p>';

  const isBeritaAcara = (activeTemplate.id === 'tpl_berita_acara' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('berita acara')));
  const isPermohonanMurid = (activeTemplate.id === 'tpl_surat_permohonan_pkl_murid' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('permohonan')));
  const isKeterangan = (activeTemplate.id === 'tpl_surat_keterangan_pkl' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('keterangan')));
  const isTugasOrMonitoring = (
    activeTemplate.id === 'tpl_suket_monitoring_pkl' || 
    (activeTemplate.nama && (activeTemplate.nama.toLowerCase().includes('monitoring') || activeTemplate.nama.toLowerCase().includes('tugas'))) || 
    rawHtml.toLowerCase().includes('surat tugas')
  );
  
  const docJudulContainer = document.getElementById('docJudulContainer');
  const docJudulSurat = document.getElementById('docJudulSurat');
  const docNoSurat = document.getElementById('docNoSurat');
  
  if (docNoSurat) docNoSurat.textContent = s.noSurat || 'B.10.000/9546/SMKN1KLK/DIKPORA';

  // Sembunyikan container statis jika template sudah menyertakan nomor atau judul surat sendiri
  const hasEmbeddedHeader = rawHtml.includes('{noSurat}') || rawHtml.includes('Nomor:') || rawHtml.includes('Perihal:');
  if (docJudulContainer) {
    docJudulContainer.style.display = hasEmbeddedHeader ? 'none' : 'block';
    if (!hasEmbeddedHeader && docJudulSurat) {
      docJudulSurat.style.textDecoration = 'none';
      docJudulSurat.textContent = isKeterangan ? 'SURAT KETERANGAN' : (isTugasOrMonitoring ? 'SURAT TUGAS' : 'SURAT PENGANTAR');
    }
  }

  // 3. Tujuan Surat (Sembunyikan untuk Surat Tugas / Monitoring, Keterangan, Berita Acara, atau yang sudah memuat tujuan)
  const tujuanContainer = document.getElementById('docTujuanSuratContainer');
  const docNamaTempat = document.getElementById('docNamaTempat');
  const docAlamatTempat = document.getElementById('docAlamatTempat');
  const hasEmbeddedTujuan = rawHtml.includes('Kepada') || rawHtml.includes('{tempatPkl}') || rawHtml.includes('{daftarTempatPkl}') || isTugasOrMonitoring || isKeterangan || isBeritaAcara;

  if (tujuanContainer) {
    tujuanContainer.style.display = hasEmbeddedTujuan ? 'none' : 'block';
    if (!hasEmbeddedTujuan) {
      const targetTempat = firstStudent.tempat || 'Pimpinan DU/DI';
      if (docNamaTempat) docNamaTempat.textContent = targetTempat;
      
      if (docAlamatTempat) {
        if (AppState.showAlamat && firstStudent.alamat) {
          docAlamatTempat.textContent = firstStudent.alamat;
          docAlamatTempat.style.display = 'block';
        } else {
          docAlamatTempat.style.display = 'none';
        }
      }

  // Pastikan underline pada judul surat (misal Berita Acara) dihilangkan
  rawHtml = rawHtml.replace(/font-size:\s*13pt;\s*margin-bottom:\s*4px;\s*text-decoration:\s*underline;/gi, 'font-size: 13pt; margin-bottom: 4px;');
  rawHtml = rawHtml.replace(/text-decoration:\s*underline;\s*font-size:\s*13pt;/gi, 'font-size: 13pt;');
  rawHtml = rawHtml.replace(/(<p[^>]*font-size:\s*13pt[^>]*)text-decoration:\s*underline;?([^>]*>)/gi, '$1$2');
  
  // Format tabel siswa untuk variabel {tabelSiswaPermohonan}

        <tr style="background-color: #f1f5f9; text-align: center; font-weight: bold;">

          <th style="padding: 5px; border: 1px solid #000;">Nama Siswa</th>
          <th style="padding: 5px; width: 90px; border: 1px solid #000;">NIS/NISN</th>
          <th style="padding: 5px; width: 85px; border: 1px solid #000;">Kelas</th>

        </tr>

        ${activeStudents.map((st, i) => `

            <td style="padding: 4px 8px; border: 1px solid #000;">${st.jurusan || '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  // Substitusi Variabel
  const uniquePlaces = [...new Set((activeStudents || []).map(st => st.tempat).filter(Boolean))];
  const daftarTempatHtml = uniquePlaces.length > 0 
    ? uniquePlaces.map((pl, idx) => `<div>${idx + 1}. ${pl}</div>`).join('')

// Realtime Quick Search Autocomplete
function onQuickSearchInput(val) {
  const resBox = document.getElementById('quickSearchResults');
  const q = String(val).trim().toLowerCase();
  if (!q || q.length < 2) {
    resBox.classList.add('hidden');
    return;
  }

  const matches = [];
  AppState.records.forEach((s, idx) => {
    if (s.siswa.toLowerCase().includes(q) || s.guru.toLowerCase().includes(q) || s.tempat.toLowerCase().includes(q) || s.kelas.toLowerCase().includes(q)) {
      matches.push({ student: s, index: idx });
    }
  });

  if (matches.length === 0) {
    resBox.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Tidak ada hasil cocok.</div>';
    resBox.classList.remove('hidden');
    return;
  }

  resBox.innerHTML = matches.slice(0, 8).map(m => `
    <div onclick="selectSearchResult(${m.index})" class="p-2.5 hover:bg-indigo-50 border-b border-slate-100 cursor-pointer transition text-xs">
      <div class="font-bold text-slate-800">${m.student.siswa} <span class="font-normal text-[11px] text-slate-400">(${m.student.kelas})</span></div>
      <div class="text-[11px] text-indigo-600">${m.student.tempat}</div>
      <div class="text-[10px] text-slate-400">Pembimbing: ${m.student.guru}</div>
    </div>
  `).join('');
  resBox.classList.remove('hidden');
}

function selectSearchResult(idx) {
  document.getElementById('quickSearchResults').classList.add('hidden');
  document.getElementById('quickSearchInput').value = '';
  setSelectionMode('per-siswa');
  AppState.selectedSiswaIdx = idx;
  const select = document.getElementById('siswaSelect');
  if (select) select.value = idx;
  renderAll();
}

// ================= MODAL & HALAMAN TEMPLATE WYSIWYG =================
function openTemplateModal(tab = 'editor') {
  if (typeof closeDatabaseModal === 'function') closeDatabaseModal();
  if (typeof closeSettingsModal === 'function') closeSettingsModal();
  if (typeof closeBatchPrintModal === 'function') closeBatchPrintModal();
  if (typeof closeDriveSuccessModal === 'function') closeDriveSuccessModal();
  if (typeof closeAllDropdowns === 'function') closeAllDropdowns();

  if (window.location.protocol === 'file:' || window.isLocalPreview) {
    if (typeof switchLocalPage === 'function') {
      switchLocalPage('template');
      switchTemplateTab(tab);
      return;
    }
  }

  const modalEl = document.getElementById('templateManagerModal');
  if (modalEl) {
    modalEl.classList.remove('hidden');
    populateEditorTemplateSelect();
    switchTemplateTab(tab);
    loadTemplateToEditor(AppState.editingTemplateId || AppState.activeTemplateId);
  } else {
    navigateTo('template', tab ? { tab: tab } : {});
  }
}

function closeTemplateModal() {
  const modalEl = document.getElementById('templateManagerModal');
  if (modalEl) modalEl.classList.add('hidden');
}

function switchTemplateTab(tab) {
  const isEditor = (tab === 'editor');
  document.getElementById('templateEditorView').classList.toggle('hidden', !isEditor);
  document.getElementById('templateListView').classList.toggle('hidden', isEditor);

  document.getElementById('btnTabEditor').className = isEditor 
    ? 'px-3 sm:px-4 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-sm flex items-center gap-1.5 transition whitespace-nowrap shrink-0'
    : 'px-3 sm:px-4 py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1.5 transition whitespace-nowrap shrink-0';

  document.getElementById('btnTabList').className = !isEditor 
    ? 'px-3 sm:px-4 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-sm flex items-center gap-1.5 transition whitespace-nowrap shrink-0'
    : 'px-3 sm:px-4 py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1.5 transition whitespace-nowrap shrink-0';

    let opts = AppState.templates.map(t => 
      `<option value="${t.id}" ${t.id === AppState.editingTemplateId ? 'selected' : ''}>${t.nama}</option>`
    ).join('');
    if (AppState.editingTemplateId === '__new__') {
      opts = `<option value="__new__" selected>+ Redaksi Baru (Belum Disimpan)</option>` + opts;

  if (document.getElementById('templateTabCount')) document.getElementById('templateTabCount').textContent = count;

// WYSIWYG Commands & Formatting
function execEditorCmd(cmd, value = null) {
  document.getElementById('wysiwygEditor').focus();
  document.execCommand(cmd, false, value);
}

function insertEditorVariable(varStr) {
  if (AppState.isHtmlMode) {
    const ta = document.getElementById('htmlEditorTextarea');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + varStr + ta.value.substring(end);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + varStr.length;
  } else {
    document.getElementById('wysiwygEditor').focus();
    document.execCommand('insertText', false, varStr);
  }
}

function toggleEditorHtmlMode() {
  AppState.isHtmlMode = !AppState.isHtmlMode;
  const editorDiv = document.getElementById('wysiwygEditor');
  const textarea = document.getElementById('htmlEditorTextarea');
  const btn = document.getElementById('btnToggleHtmlMode');

  if (AppState.isHtmlMode) {
    textarea.value = editorDiv.innerHTML;
    editorDiv.classList.add('hidden');
    textarea.classList.remove('hidden');
    btn.innerHTML = '<i data-lucide="eye" class="w-3.5 h-3.5"></i><span>Mode Visual</span>';
  } else {
    editorDiv.innerHTML = textarea.value;
    textarea.classList.add('hidden');
    editorDiv.classList.remove('hidden');
    btn.innerHTML = '<i data-lucide="code" class="w-3.5 h-3.5"></i><span>Mode HTML</span>';
  }
  if (window.lucide) lucide.createIcons();
}

function resetEditorToOfficialStandard() {
  const currentId = AppState.editingTemplateId;
  const def = DEFAULT_TEMPLATES.find(t => t.id === currentId) || 
              AppState.templates.find(t => t.id === currentId) || 
              DEFAULT_TEMPLATES.find(t => t.id === 'tpl_berita_acara') ||

// Simpan Perubahan Template ke Database Sheets
function saveCurrentTemplateChanges() {
  const content = AppState.isHtmlMode 
    ? document.getElementById('htmlEditorTextarea').value 
    : document.getElementById('wysiwygEditor').innerHTML;
  const name = (document.getElementById('inputTemplateName').value || '').trim();

  if (!name) {
    showToast('Harap masukkan nama template / redaksi surat!', 'error');
    const nameEl = document.getElementById('inputTemplateName');
    if (nameEl) nameEl.focus();
    return;
  }

  // Jika sedang dalam mode Buat Redaksi Baru
  if (AppState.editingTemplateId === '__new__' || !AppState.editingTemplateId) {
    const newId = 'tpl_' + Date.now();
    const newTpl = {
      id: newId,
      nama: name,
      html_content: content,
      is_default: 0,
      status: 'active'
    };

    AppState.templates.push(newTpl);
    AppState.editingTemplateId = newId;
    setActiveTemplate(newId);
    syncTemplatesCache(AppState.templates);

    const badgeNew = document.getElementById('badgeNewRedaksi');
    if (badgeNew) badgeNew.classList.add('hidden');
    const btnSaveText = document.getElementById('btnSaveTemplateText');
    if (btnSaveText) btnSaveText.textContent = 'Simpan ke Database';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast('Menyimpan redaksi baru ke Google Sheets...', 'info');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.templates) {
            AppState.templates = res.templates;
          }
          syncTemplatesCache(AppState.templates);
          showToast('Redaksi surat baru berhasil disimpan dan siap digunakan!', 'success');
          populateEditorTemplateSelect();
          renderTemplateTableList();
          renderAll();
        })
        .withFailureHandler(function(err) {
          showToast('Gagal menyimpan ke Google Sheets: ' + err, 'error');
        })
        .saveTemplate(newTpl);
    } else {
      showToast('Redaksi baru berhasil disimpan di sesi lokal!', 'success');
      populateEditorTemplateSelect();
      renderTemplateTableList();
      renderAll();
    }
    return;
  }

  // Jika memperbarui template yang sudah ada
  const targetTpl = AppState.templates.find(t => t.id === AppState.editingTemplateId);
  if (targetTpl) {
    targetTpl.nama = name;
    targetTpl.html_content = content;
    setActiveTemplate(targetTpl.id);
    syncTemplatesCache(AppState.templates);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast('Menyimpan perubahan template ke Google Sheets...', 'info');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.templates) {
            AppState.templates = res.templates;
          }
          syncTemplatesCache(AppState.templates);
          showToast('Template berhasil diperbarui di Google Sheets!', 'success');
          populateEditorTemplateSelect();
          renderTemplateTableList();
          renderAll();
        })
        .withFailureHandler(function(err) {
          showToast('Gagal menyimpan template: ' + err, 'error');
        })
        .saveTemplate(targetTpl);
    } else {
      showToast('Perubahan template disimpan di sesi lokal!', 'success');
      populateEditorTemplateSelect();
      renderTemplateTableList();
      renderAll();
    }
  }
}

    const isDeletable = (t.id !== 'tpl_berita_acara');
    return `

      <td class="p-3">
        <div class="font-bold text-slate-800">${t.nama}</div>
        <div class="text-[10px] text-slate-400 font-mono">${t.id}</div>

          ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">Sedang Digunakan</span>' 
          : '<span class="px-2 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-600">Tersedia</span>'}

          <button onclick="deleteTemplateFromList('${t.id}')" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg transition text-[11px] cursor-pointer" title="Hapus template ini">
            Hapus

function deleteTemplateFromList(tplId) {
  const tpl = AppState.templates.find(t => t.id === tplId);
  if (!tpl) return;
  
  showModernConfirm({
    title: 'Hapus Template',
    message: `Apakah Anda yakin ingin menghapus template "${tpl.nama}"? Tindakan ini tidak dapat dibatalkan.`,
    okText: 'Hapus Template',
    cancelText: 'Batal',
    type: 'danger',
    onConfirm: function() {
      AppState.templates = AppState.templates.filter(t => t.id !== tplId);
      if (AppState.activeTemplateId === tplId) {
        setActiveTemplate(AppState.templates[0] ? AppState.templates[0].id : 'tpl_berita_acara');
      }
      if (AppState.editingTemplateId === tplId) {
        AppState.editingTemplateId = AppState.activeTemplateId;
        loadTemplateToEditor(AppState.activeTemplateId);
      }
      syncTemplatesCache(AppState.templates);
      
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        showToast('Menghapus template dari Google Sheets...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.templates) {
              AppState.templates = res.templates;
            }
            syncTemplatesCache(AppState.templates);
            showToast('Template berhasil dihapus!', 'success');
            populateEditorTemplateSelect();
            renderTemplateTableList();
            renderAll();
          })
          .withFailureHandler(function(err) {
            showToast('Gagal menghapus template: ' + err, 'error');
          })
          .deleteTemplate(tplId);
      } else {
        showToast('Template berhasil dihapus dari sesi!', 'success');
        populateEditorTemplateSelect();
        renderTemplateTableList();
        renderAll();
      }
    }
  });
}

function useTemplate(tplId) {
  setActiveTemplate(tplId);
  closeTemplateModal();
  renderAll();
  showToast('Template surat berhasil diaktifkan!', 'success');
}

function editTemplateFromList(tplId) {
  AppState.editingTemplateId = tplId;
  switchTemplateTab('editor');
  loadTemplateToEditor(tplId);
  const sel = document.getElementById('editorTemplateSelect');
  if (sel) sel.value = tplId;
}

// ================= HELPER ESCAPE HTML =================
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ================= UPDATE NAMA JURUSAN MASAL =================
function openUpdateJurusanModal() {
  const selectEl = document.getElementById('selectJurusanLama');
  const inputEl = document.getElementById('inputJurusanBaru');
  const modal = document.getElementById('modalUpdateJurusan');
  if (!modal || !selectEl) return;

  const records = AppState.records || [];
  const counts = {};
  const list = [];

  records.forEach(r => {
    const j = (r.jurusan || '').trim();
    if (j) {
      if (!counts[j]) {
        counts[j] = 0;
        list.push(j);
      }
      counts[j]++;
    }
  });

  list.sort((a, b) => a.localeCompare(b));

  if (list.length === 0) {
    selectEl.innerHTML = '<option value="">-- Tidak ada jurusan terdaftar --</option>';
    if (inputEl) inputEl.value = '';
    onJurusanLamaChange();
  } else {
    selectEl.innerHTML = list.map(j => `<option value="${escapeHtml(j)}">${escapeHtml(j)} (${counts[j]} siswa)</option>`).join('');
    if (inputEl) inputEl.value = list[0];
    onJurusanLamaChange();
  }

  modal.classList.remove('hidden');
  if (inputEl) {
    setTimeout(() => {
      inputEl.focus();
      inputEl.select();
    }, 100);
  }
}

function closeUpdateJurusanModal() {
  const modal = document.getElementById('modalUpdateJurusan');
  if (modal) modal.classList.add('hidden');
}

function onJurusanLamaChange() {
  const selectEl = document.getElementById('selectJurusanLama');
  const countEl = document.getElementById('countJurusanSiswaTerdampak');
  const inputEl = document.getElementById('inputJurusanBaru');
  if (!selectEl || !countEl) return;

  const selectedJurusan = selectEl.value;
  if (!selectedJurusan) {
    countEl.textContent = '0 siswa';
    return;
  }

  const records = AppState.records || [];
  let matchingCount = 0;
  records.forEach(r => {
    if (String(r.jurusan || '').trim().toLowerCase() === selectedJurusan.toLowerCase()) {
      matchingCount++;
    }
  });

  countEl.textContent = `${matchingCount} siswa`;
  if (inputEl && (!inputEl.value || selectEl.dataset.prevVal !== selectedJurusan)) {
    inputEl.value = selectedJurusan;
  }
  selectEl.dataset.prevVal = selectedJurusan;
}

function handleBatchJurusanSubmit(event) {
  if (event) event.preventDefault();
  const selectEl = document.getElementById('selectJurusanLama');
  const inputEl = document.getElementById('inputJurusanBaru');
  if (!selectEl || !inputEl) return;

  const oldJurusan = selectEl.value;
  const newJurusan = inputEl.value.trim();

  if (!oldJurusan) {
    showToast('Pilih nama jurusan lama yang ingin diganti.', 'warning');
    return;
  }
  if (!newJurusan) {
    showToast('Ketikkan nama jurusan baru.', 'warning');
    return;
  }
  if (oldJurusan.toLowerCase() === newJurusan.toLowerCase()) {
    showToast('Nama jurusan lama dan jurusan baru tidak boleh sama.', 'warning');
    return;
  }

  // Update in-memory AppState.records
  let updatedCount = 0;
  (AppState.records || []).forEach(r => {
    if (String(r.jurusan || '').trim().toLowerCase() === oldJurusan.toLowerCase()) {
      r.jurusan = newJurusan;
      updatedCount++;
    }
  });

  if (updatedCount === 0) {
    showToast(`Tidak ditemukan siswa dengan jurusan "${oldJurusan}".`, 'warning');
    closeUpdateJurusanModal();
    return;
  }

  // Bersihkan cache dan perbarui UI seketika
  try { localStorage.removeItem('surat_pkl_cached_data'); } catch(e) {}
  processDataset();
  renderDbTable();
  renderAll();
  closeUpdateJurusanModal();

  // Sinkronkan ke Google Sheets via Apps Script
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast(`Menyimpan perubahan ${updatedCount} siswa ke Google Sheets...`, 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          if (res.students) {
            AppState.records = res.students;
            processDataset();
            renderDbTable();
            renderAll();
          }
          showToast(`Berhasil mengubah nama jurusan "${oldJurusan}" menjadi "${newJurusan}" untuk ${res.updatedCount || updatedCount} siswa di Google Sheets!`, 'success');
        } else {
          showToast((res && res.message) || 'Gagal menyinkronkan ke spreadsheet.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Gagal menyinkronkan ke Google Sheets: ' + err.toString(), 'error');
      })
      .updateJurusanBatch(oldJurusan, newJurusan);
  } else {
    showToast(`Mode Pratinjau: Berhasil mengubah nama jurusan "${oldJurusan}" menjadi "${newJurusan}" (${updatedCount} siswa).`, 'success');
  }
}

function exportDataToExcel() {

  if (records.length === 0) {

    return;
  }

  const exportRows = records.map((r, idx) => ({

    'NIP Pembimbing': r.nip ? String(r.nip) : '',
    'Pangkat/Gol Pembimbing': r.guru_pangkat || r.pangkat || '',
    'Jabatan Pembimbing': r.guru_jabatan || r.jabatan || '',
    'Nama Siswa': r.siswa || '',
    'NIS': r.nis ? String(r.nis) : '',
    'NISN': r.nisn ? String(r.nisn) : '',
    'Kelas': r.kelas || '',
    'Konsentrasi Keahlian / Jurusan': r.jurusan || '',
    'Tempat PKL': r.tempat || '',
    'Alamat Tempat PKL': r.alamat || ''
  }));

  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const filename = `Data_Siswa_PKL_${dateStr}.xls`;

  if (typeof XLSX !== 'undefined') {
    const ws = XLSX.utils.json_to_sheet(exportRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data Siswa PKL");
    XLSX.writeFile(wb, filename, { bookType: "biff8" });

function exportToHtmlTableXls(rows, filename) {
  const headers = ['No', 'Guru Pembimbing', 'NIP Pembimbing', 'Pangkat/Gol Pembimbing', 'Jabatan Pembimbing', 'Nama Siswa', 'NIS', 'NISN', 'Kelas', 'Konsentrasi Keahlian / Jurusan', 'Tempat PKL', 'Alamat Tempat PKL'];
  let tableHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Data Siswa PKL</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>
  <body><table border="1"><thead><tr style="background:#e0e7ff;font-weight:bold;">${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;

  rows.forEach(r => {
    tableHtml += `<tr>
      <td style="text-align:center;">${r['No']}</td>
      <td>${r['Guru Pembimbing']}</td>
      <td style="mso-number-format:'\\@';">${r['NIP Pembimbing']}</td>
      <td>${r['Pangkat/Gol Pembimbing']}</td>
      <td>${r['Jabatan Pembimbing']}</td>
      <td>${r['Nama Siswa']}</td>
      <td style="mso-number-format:'\\@';">${r['NIS']}</td>
      <td style="mso-number-format:'\\@';">${r['NISN']}</td>
      <td>${r['Kelas']}</td>
      <td>${r['Konsentrasi Keahlian / Jurusan']}</td>
      <td>${r['Tempat PKL']}</td>
      <td>${r['Alamat Tempat PKL']}</td>
    </tr>`;
  });
  tableHtml += '</tbody></table></body></html>';

  const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function handleExcelImportFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let rawJsonRows = [];

      if (typeof XLSX !== 'undefined') {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        rawJsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
      } else {
        showToast('Library SheetJS belum siap, silakan coba beberapa saat lagi.', 'warning');
        return;
      }

      if (!rawJsonRows || rawJsonRows.length === 0) {
        showToast('Berkas Excel kosong atau format tabel tidak dikenali.', 'warning');
        return;
      }

      const parsedList = rawJsonRows.map(normalizeImportedRow).filter(r => r.siswa && r.siswa.trim() !== '');

      if (parsedList.length === 0) {
        showToast('Tidak ditemukan data dengan kolom "Nama Siswa" yang valid pada berkas Excel.', 'warning');
        return;
      }

      const choice = confirm(
        `Ditemukan ${parsedList.length} data siswa dari berkas "${file.name}".\n\n` +
        `• Klik [OK] untuk MENGGANTI (REPLACE) seluruh data siswa di database.\n` +
        `• Klik [BATAL / CANCEL] untuk MENAMBAH (APPEND) ke data siswa yang sudah ada.`
      );
      const mode = choice ? 'replace' : 'append';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        showToast('Mengimpor data siswa ke Google Sheets...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              if (res.students) AppState.records = res.students;
              processDataset();
              renderDbTable();
              renderAll();
              showToast(`Berhasil mengimpor ${res.count} data siswa (${mode === 'replace' ? 'Ganti Baru' : 'Ditambahkan'})!`, 'success');
            } else {
              showToast('Gagal impor: ' + (res ? res.message : 'Terjadi kesalahan'), 'error');
            }
          })
          .withFailureHandler(function(err) {
            showToast('Error saat mengirim data impor ke Google Sheets: ' + err, 'error');
          })
          .importStudents(parsedList, mode);
      } else {
        // Fallback offline lokal
        if (mode === 'replace') {
          AppState.records = parsedList.map((p, idx) => ({ id: idx + 1, no_urut: idx + 1, ...p }));
        } else {
          const startNo = AppState.records.length;
          parsedList.forEach((p, idx) => {
            AppState.records.push({ id: Date.now() + idx, no_urut: startNo + idx + 1, ...p });
          });
        }
        processDataset();
        renderDbTable();
        renderAll();
        showToast(`Berhasil mengimpor ${parsedList.length} data siswa ke database lokal!`, 'success');
      }
    } catch (err) {
      showToast('Gagal memproses berkas Excel: ' + err.message, 'error');
    } finally {
      event.target.value = '';
    }
  };

  reader.onerror = function() {
    showToast('Gagal membaca berkas Excel.', 'error');
    event.target.value = '';
  };

  reader.readAsArrayBuffer(file);
}

function normalizeImportedRow(row) {
  const norm = {
    guru: '',
    nip: '',
    guru_pangkat: '',
    guru_jabatan: '',
    siswa: '',
    nis: '',
    nisn: '',
    kelas: '',
    jurusan: '',
    tempat: '',
    alamat: ''
  };

  for (const rawKey in row) {
    if (!row.hasOwnProperty(rawKey)) continue;
    const val = String(row[rawKey] !== undefined && row[rawKey] !== null ? row[rawKey] : '').trim();
    const k = rawKey.toLowerCase().replace(/[^a-z0-9]/g, '');

    // Map siswa
    if (k.includes('siswa') || k.includes('murid') || k === 'nama' || k === 'namalengkap') {
      if (!norm.siswa) norm.siswa = val;
    }
    // Map guru
    else if (k.includes('guru') || k.includes('pembimbing')) {
      if (k.includes('nip')) {
        if (!norm.nip) norm.nip = val;
      } else if (k.includes('pangkat') || k.includes('gol')) {
        if (!norm.guru_pangkat) norm.guru_pangkat = val;
      } else if (k.includes('jabatan')) {
        if (!norm.guru_jabatan) norm.guru_jabatan = val;
      } else {
        if (!norm.guru) norm.guru = val;
      }
    }
    // Map pangkat/gol
    else if (k.includes('pangkat') || k.includes('gol')) {
      if (!norm.guru_pangkat) norm.guru_pangkat = val;
    }
    // Map jabatan
    else if (k.includes('jabatan')) {
      if (!norm.guru_jabatan) norm.guru_jabatan = val;
    }
    // Map nip
    else if (k.startsWith('nip')) {
      if (!norm.nip) norm.nip = val;
    }
    // Map nis / nisn
    else if (k === 'nisn') {
      if (!norm.nisn) norm.nisn = val;
    } else if (k === 'nis' || k.includes('induk')) {
      if (!norm.nis) norm.nis = val;
    }
    // Map kelas
    else if (k.includes('kelas') || k.includes('tingkat') || k === 'rombel') {
      if (!norm.kelas) norm.kelas = val;
    }
    // Map jurusan
    else if (k.includes('jurusan') || k.includes('keahlian') || k.includes('kompetensi') || k.includes('prodi')) {
      if (!norm.jurusan) norm.jurusan = val;
    }
    // Map tempat
    else if (k.includes('tempat') || k.includes('instansi') || k.includes('perusahaan') || k.includes('dudi') || k.includes('kantor') || k.includes('mitra')) {
      if (!norm.tempat) norm.tempat = val;
    }
    // Map alamat
    else if (k.includes('alamat') || k.includes('lokasi')) {
      if (!norm.alamat) norm.alamat = val;
    }
  }

  return norm;
}

// ================= MODAL PENGATURAN & PENGELOLAAN ASET =================
function onAssetUrlChange(type) {
  let inputId, previewId, fallbackAsset;
  if (type === 'kop') {
    inputId = 'settingKopUrl';
    previewId = 'previewSettingsKop';
    fallbackAsset = typeof ASSETS !== 'undefined' ? ASSETS.kop : '';
  } else if (type === 'ttd') {
    inputId = 'settingTtdUrl';
    previewId = 'previewSettingsTtd';
    fallbackAsset = typeof ASSETS !== 'undefined' ? ASSETS.ttd : '';
  } else if (type === 'ttd_basah') {
    inputId = 'settingTtdBasahUrl';
    previewId = 'previewSettingsTtdBasah';
    fallbackAsset = typeof ASSETS !== 'undefined' ? ASSETS.ttdBasah : '';
  } else if (type === 'logo') {
    inputId = 'settingLogoWebUrl';
    previewId = 'previewSettingsLogo';
    fallbackAsset = typeof ASSETS !== 'undefined' ? ASSETS.logoWeb : '';
  }
  const inputEl = document.getElementById(inputId);
  const previewEl = document.getElementById(previewId);
  if (inputEl && previewEl) {
    const val = inputEl.value.trim() || DEFAULT_ASSET_URLS[type] || fallbackAsset;
    previewEl.src = getDirectImageUrl(val, fallbackAsset);
  }
}

function applyAssetUrl(type) {
  let inputId, settingsKey;
  if (type === 'kop') {
    inputId = 'settingKopUrl';
    settingsKey = 'kopUrl';
  } else if (type === 'ttd') {
    inputId = 'settingTtdUrl';
    settingsKey = 'ttdUrl';
  } else if (type === 'ttd_basah') {
    inputId = 'settingTtdBasahUrl';
    settingsKey = 'ttdBasahUrl';
  } else if (type === 'logo') {
    inputId = 'settingLogoWebUrl';
    settingsKey = 'logoWebUrl';
  }
  const inputEl = document.getElementById(inputId);
  if (inputEl) {
    const val = inputEl.value.trim();
    AppState.settings[settingsKey] = val;
    onAssetUrlChange(type);
    renderDocumentPreview();
    renderSidebarControls();
    showToast('Tautan ' + type.toUpperCase() + ' berhasil diterapkan!', 'success');
  }
}

function resetAssetToDefault(type) {
  let inputId, settingsKey;
  if (type === 'kop') {
    inputId = 'settingKopUrl';
    settingsKey = 'kopUrl';
  } else if (type === 'ttd') {
    inputId = 'settingTtdUrl';
    settingsKey = 'ttdUrl';
  } else if (type === 'ttd_basah') {
    inputId = 'settingTtdBasahUrl';
    settingsKey = 'ttdBasahUrl';
  } else if (type === 'logo') {
    inputId = 'settingLogoWebUrl';
    settingsKey = 'logoWebUrl';
  }
  const defaultUrl = DEFAULT_ASSET_URLS[type] || '';
  const inputEl = document.getElementById(inputId);
  if (inputEl) {
    inputEl.value = defaultUrl;
    AppState.settings[settingsKey] = defaultUrl;
    onAssetUrlChange(type);
    renderDocumentPreview();
    renderSidebarControls();
  }
}

function handleAssetFileUpload(event, type) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  let btnLabelId, previewId, settingsKey, inputId;
  if (type === 'kop') {
    btnLabelId = 'btnLabelUploadKop';
    previewId = 'previewSettingsKop';
    settingsKey = 'kopUrl';
    inputId = 'settingKopUrl';
  } else if (type === 'ttd') {
    btnLabelId = 'btnLabelUploadTtd';
    previewId = 'previewSettingsTtd';
    settingsKey = 'ttdUrl';
    inputId = 'settingTtdUrl';
  } else if (type === 'ttd_basah') {
    btnLabelId = 'btnLabelUploadTtdBasah';
    previewId = 'previewSettingsTtdBasah';
    settingsKey = 'ttdBasahUrl';
    inputId = 'settingTtdBasahUrl';
  } else if (type === 'logo') {
    btnLabelId = 'btnLabelUploadLogo';
    previewId = 'previewSettingsLogo';
    settingsKey = 'logoWebUrl';
    inputId = 'settingLogoWebUrl';
  }

  const labelEl = document.getElementById(btnLabelId);
  const origLabel = labelEl ? labelEl.textContent : '';
  if (labelEl) labelEl.textContent = 'Membaca berkas...';

  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    // Tampilkan pratinjau langsung secara instan
    const previewEl = document.getElementById(previewId);
    if (previewEl) previewEl.src = dataUrl;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      if (labelEl) labelEl.textContent = 'Mengunggah ke Drive...';
      const base64Data = dataUrl.split(',')[1] || '';

      google.script.run
        .withSuccessHandler(function(res) {
          if (labelEl) labelEl.textContent = origLabel;
          if (res && res.success) {
            const uploadedUrl = res.fileUrl || res.viewUrl;
            AppState.settings[settingsKey] = uploadedUrl;
            const inputEl = document.getElementById(inputId);
            if (inputEl) inputEl.value = uploadedUrl;
            renderDocumentPreview();
            renderSidebarControls();
            showToast('Berkas ' + file.name + ' berhasil diunggah ke Google Drive dan dijadikan aset aktif!', 'success');
          } else {
            showToast('Gagal mengunggah berkas ke Drive: ' + (res ? res.error : 'Terjadi kesalahan'), 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (labelEl) labelEl.textContent = origLabel;
          showToast('Error unggah ke Google Drive: ' + err, 'error');
        })
        .uploadAssetToDrive({
          name: file.name,
          mimeType: file.type || 'image/png',
          data: base64Data,
          type: type
        });
    } else {
      // Fallback offline: gunakan data URL
      AppState.settings[settingsKey] = dataUrl;
      const inputEl = document.getElementById(inputId);
      if (inputEl) inputEl.value = dataUrl;
      renderDocumentPreview();
      renderSidebarControls();
      if (labelEl) labelEl.textContent = origLabel;
      showToast('Berkas ' + file.name + ' berhasil dimuat ke aplikasi lokal!', 'success');
    }
  };
  reader.onerror = function() {
    if (labelEl) labelEl.textContent = origLabel;
    showToast('Gagal membaca berkas gambar.', 'error');
  };
  reader.readAsDataURL(file);
}

function openSettingsModal() {
  if (typeof closeDatabaseModal === 'function') closeDatabaseModal();
  if (typeof closeTemplateModal === 'function') closeTemplateModal();
  if (typeof closeBatchPrintModal === 'function') closeBatchPrintModal();
  if (typeof closeDriveSuccessModal === 'function') closeDriveSuccessModal();
  if (typeof closeAllDropdowns === 'function') closeAllDropdowns();

  if (window.location.protocol === 'file:' || window.isLocalPreview) {
    if (typeof switchLocalPage === 'function') {
      switchLocalPage('pengaturan');
      return;
    }
  }

  const modal = document.getElementById('settingsModal');
  if (modal) {
    populateSettingsInputs();
    modal.classList.remove('hidden');
    if (window.lucide) lucide.createIcons();
  } else {
    navigateTo('pengaturan');
  }
}

function closeSettingsModal() {
  const modal = document.getElementById('settingsModal');
  if (modal) modal.classList.add('hidden');
}

function saveApplicationSettings() {
  const s = AppState.settings || {};
  const getVal = (id, fallback) => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : (fallback || '');
  };

  s.kopUrl = getVal('settingKopUrl', DEFAULT_ASSET_URLS.kop);
  s.ttdUrl = getVal('settingTtdUrl', DEFAULT_ASSET_URLS.ttd);
  s.ttdBasahUrl = getVal('settingTtdBasahUrl', DEFAULT_ASSET_URLS.ttd_basah);
  s.logoWebUrl = getVal('settingLogoWebUrl', DEFAULT_ASSET_URLS.logo);
  s.driveFolderUrl = getVal('settingDriveFolderUrl', AppState.driveFolderUrl || '');

  s.namaSekolah = getVal('settingNamaSekolah', 'SMK Negeri 1 Klungkung');
  s.subJudulSekolah = getVal('settingSubJudulSekolah', '');
  s.alamatSekolah = getVal('settingAlamatSekolah', '');
  s.kepsekNama = getVal('settingKepsekNama', '');
  s.kepsekPangkat = getVal('settingKepsekPangkat', '');
  s.kepsekNip = getVal('settingKepsekNip', '');
  s.tahunAjaran = getVal('settingTahunAjaran', '');

  AppState.driveFolderUrl = s.driveFolderUrl;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    showToast('Menyimpan pengaturan ke database...', 'info');
    google.script.run
      .withSuccessHandler(function() {
        showToast('Pengaturan berhasil disimpan ke Google Sheets!', 'success');
        closeSettingsModal();
        populateSettingsInputs();
        renderAll();
      })
      .withFailureHandler(function(err) {
        showToast('Gagal menyimpan pengaturan ke Google Sheets: ' + err, 'error');
      })
      .saveSettings(s);
  } else {
    showToast('Pengaturan berhasil disimpan (mode lokal)!', 'success');
    closeSettingsModal();
    populateSettingsInputs();
    renderAll();
  }
}

// ================= SIMPAN KE GOOGLE DRIVE =================
function saveCurrentDocToDrive() {
  const activeStudents = getActiveFilteredStudents();
  if (!activeStudents || activeStudents.length === 0) {
    showToast('Tidak ada data siswa untuk disimpan ke Drive.', 'warning');
    return;
  }
  const firstStudent = activeStudents[0] || {};
  const safeName = (firstStudent.guru || firstStudent.siswa || 'Dokumen').replace(/[^a-zA-Z0-9]/g, '_');
  const filename = `Surat_PKL_${safeName}_${Date.now()}.html`;

  let innerContent = '';
  const docContainer = document.getElementById('documentTemplate');
  if (docContainer) {
    innerContent = docContainer.innerHTML;
  } else {
    const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0];
    innerContent = buildSingleSuratHtml(activeStudents, activeTemplate, AppState.settings);
  }

  // Ambil HTML dokumen lengkap
  const fullHtml = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>${filename}</title>
      <style>
        body { font-family: 'Bookman Old Style', serif; margin: 20mm; font-size: 11.5pt; }
        table { border-collapse: collapse; }
      </style>
    </head>
    <body>
      ${innerContent}
    </body>
    </html>
  `;

  const base64Data = btoa(unescape(encodeURIComponent(fullHtml)));

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    let btn = null;
    try { if (typeof event !== 'undefined' && event && event.target) btn = event.target.closest('button') || event.target; } catch(e) {}
    const origText = btn ? btn.innerHTML : '';
    if (btn) btn.innerHTML = '<span>Menyimpan ke Drive...</span>';

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) btn.innerHTML = origText;
        if (res && res.success) {
          showDriveSuccessModal(res);
        } else {
          showToast('Gagal menyimpan ke Google Drive: ' + (res ? res.error : 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) btn.innerHTML = origText;
        showToast('Error menyimpan ke Drive: ' + err, 'error');
      })
      .saveFileToDrive({
        filename: filename,
        mimeType: 'text/html',
        data: base64Data
      });
  } else {
    showToast('Fungsi simpan Drive aktif pada lingkungan Google Apps Script.', 'info');
  }
}

function showDriveSuccessModal(res) {
  document.getElementById('driveSuccessFilename').textContent = `Berkas "${res.fileName}" berhasil dibuat dan disimpan.`;
  document.getElementById('btnDriveViewFile').href = res.viewUrl || res.fileUrl;
  document.getElementById('btnDriveViewFolder').href = res.folderUrl;
  document.getElementById('driveSuccessModal').classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
}

function closeDriveSuccessModal() {
  document.getElementById('driveSuccessModal').classList.add('hidden');
}

// ================= CETAK & UNDUH DOKUMEN =================
function printCurrentDoc() {
  const docContainer = document.getElementById('documentTemplate');
  if (docContainer) {
    window.print();
  } else {
    // Cetak surat aktif secara instan dari menu Database / Template / Pengaturan
    const activeStudents = getActiveFilteredStudents();
    if (!activeStudents || activeStudents.length === 0) {
      showToast('Tidak ada data siswa untuk dicetak.', 'warning');
      return;
    }
    const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0];
    const s = AppState.settings;
    const container = document.getElementById('batchPrintContainer');
    if (container) {
      const singleHtml = buildSingleSuratHtml(activeStudents, activeTemplate, s);
      container.innerHTML = `<div class="doc-page paper-${AppState.paperSize}">${singleHtml}</div>`;
      document.body.classList.add('batch-print-active');
      window.print();
      setTimeout(() => {
        document.body.classList.remove('batch-print-active');
        container.innerHTML = '';
      }, 1000);
    } else {
      navigateTo('surat');
    }
  }
}

/**
 * Helper menghasilkan HTML Halaman 1 (Surat)
 */
function buildSingleSuratHtml(studentList, activeTemplate, s) {
  const firstStudent = studentList[0] || {};
  const isBeritaAcara = (activeTemplate.id === 'tpl_berita_acara' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('berita acara')));
  const isPermohonanMurid = (activeTemplate.id === 'tpl_surat_permohonan_pkl_murid' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('permohonan')));
  const isKeterangan = (activeTemplate.id === 'tpl_surat_keterangan_pkl' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('keterangan')));

  let rawHtml = activeTemplate.html_content || '<p>Redaksi template belum disetel.</p>';

  const isTugasOrMonitoring = (
    activeTemplate.id === 'tpl_suket_monitoring_pkl' || 
    (activeTemplate.nama && (activeTemplate.nama.toLowerCase().includes('monitoring') || activeTemplate.nama.toLowerCase().includes('tugas'))) || 
    rawHtml.toLowerCase().includes('surat tugas')
  );

  rawHtml = rawHtml.replace(/font-size:\s*13pt;\s*margin-bottom:\s*4px;\s*text-decoration:\s*underline;/gi, 'font-size: 13pt; margin-bottom: 4px;');
  rawHtml = rawHtml.replace(/text-decoration:\s*underline;\s*font-size:\s*13pt;/gi, 'font-size: 13pt;');
  rawHtml = rawHtml.replace(/(<p[^>]*font-size:\s*13pt[^>]*)text-decoration:\s*underline;?([^>]*>)/gi, '$1$2');

  const hasEmbeddedHeader = rawHtml.includes('{noSurat}') || rawHtml.includes('Nomor:') || rawHtml.includes('Perihal:');
  const hasEmbeddedTujuan = rawHtml.includes('Kepada') || rawHtml.includes('{tempatPkl}') || rawHtml.includes('{daftarTempatPkl}') || isTugasOrMonitoring || isKeterangan || isBeritaAcara;

  // 1. Kop Surat
  let kopHtml = '';
  if (AppState.showKop) {
    const rawKop = s.kopUrl || DEFAULT_ASSET_URLS.kop;
    const kopSrc = getDirectImageUrl(rawKop, typeof ASSETS !== 'undefined' ? ASSETS.kopFyj : '');
    if (kopSrc) {
      kopHtml = `<div style="margin-bottom: 8px;"><img src="${kopSrc}" alt="Kop Surat" style="width: 100%; max-height: 120px; object-fit: contain;"></div>`;
    }
  }

  // 2. Judul Surat Luar
  let judulHtml = '';
  if (!hasEmbeddedHeader) {
    const judulText = isKeterangan ? 'SURAT KETERANGAN' : (isTugasOrMonitoring ? 'SURAT TUGAS' : 'SURAT PENGANTAR');
    const noSuratText = s.noSurat || 'B.10.000/9546/SMKN1KLK/DIKPORA';
    judulHtml = `
      <div style="text-align: center; margin-top: 10px; margin-bottom: 14px;">
        <div style="font-size: 13pt; font-weight: bold; letter-spacing: 1px;">${judulText}</div>
        <div style="font-size: 11pt; margin-top: 2px;">Nomor: ${noSuratText}</div>
      </div>
    `;
  }

  // 3. Tujuan Surat Luar
  let tujuanHtml = '';
  if (!hasEmbeddedTujuan) {
    const targetTempat = firstStudent.tempat || 'Pimpinan DU/DI';
    const alamatText = (AppState.showAlamat && firstStudent.alamat) ? `<div style="font-size: 10.5pt; color: #333;">${firstStudent.alamat}</div>` : '';
    tujuanHtml = `
      <div style="margin-bottom: 14px;">
        <table style="width: 100%; border: none;">
          <tr>
            <td style="width: 10%; vertical-align: top; border: none;">Kepada:</td>
            <td style="border: none;"></td>
          </tr>
          <tr>
            <td style="vertical-align: top; border: none;">Yth.</td>
            <td style="border: none;">
              <div style="font-weight: bold;">${targetTempat}</div>
              ${alamatText}
              <div>di -</div>
              <div style="text-indent: 20px;">Tempat</div>
            </td>
          </tr>
        </table>
      </div>
    `;
  }

  // 4. Tabel Siswa (untuk placeholder {tabelSiswaPermohonan} jika ada di badan surat)
  const tabelSiswaHtml = `
    <table class="lampiran-table" style="width: 99.6%; max-width: 99.6%; border-collapse: collapse; margin-top: 8px; margin-bottom: 8px; font-size: 11pt; table-layout: fixed; box-sizing: border-box;" border="1">
      <thead>
        <tr style="background-color: #f1f5f9; text-align: center; font-weight: bold;">
          <th style="padding: 5px; width: 6%; border: 1px solid #000; text-align: center; box-sizing: border-box;">No</th>
          <th style="padding: 5px 8px; width: 28%; border: 1px solid #000; text-align: left; box-sizing: border-box;">Nama Siswa</th>
          <th style="padding: 5px; width: 24%; border: 1px solid #000; text-align: center; box-sizing: border-box;">NIS/NISN</th>
          <th style="padding: 5px; width: 14%; border: 1px solid #000; text-align: center; box-sizing: border-box;">Kelas</th>
          <th style="padding: 5px 8px; width: 28%; border: 1px solid #000; text-align: left; box-sizing: border-box;">Konsentrasi Keahlian</th>
        </tr>
      </thead>
      <tbody>
        ${studentList.map((st, i) => `
          <tr>
            <td style="padding: 5px; text-align: center; border: 1px solid #000; box-sizing: border-box;">${i + 1}</td>
            <td style="padding: 5px 8px; border: 1px solid #000; font-weight: 500; text-align: left; word-break: break-word; box-sizing: border-box;">${st.siswa}</td>
            <td style="padding: 5px; text-align: center; border: 1px solid #000; box-sizing: border-box;">${st.nis || '-'}/${st.nisn || '-'}</td>
            <td style="padding: 5px; text-align: center; border: 1px solid #000; box-sizing: border-box;">${st.kelas || '-'}</td>
            <td style="padding: 5px 8px; border: 1px solid #000; text-align: left; word-break: break-word; box-sizing: border-box;">${st.jurusan || '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  // 5. Substitusi Variabel dengan formatIndonesianDate
  const uniquePlaces = [...new Set((studentList || []).map(st => st.tempat).filter(Boolean))];
  const daftarTempatHtml = uniquePlaces.length > 0 
    ? uniquePlaces.map((pl, idx) => `<div>${idx + 1}. ${pl}</div>`).join('')
    : `<div>1. ${firstStudent.tempat || 'Dunia Usaha / Dunia Industri'}</div>`;

  const varMap = {
    '{namaSekolah}': s.namaSekolah || 'SMKN 1 FYJ Channel',
    '{tahunAjaran}': s.tahunAjaran || '2026/2027',
    '{tglPelepasan}': formatIndonesianDate(firstStudent.tgl_pelepasan || s.tglPelepasan || '13 November 2026'),
    '{periodePkl}': s.periodePkl || '13 November 2026 sampai dengan 30 April 2027',
    '{tglPenarikan}': formatIndonesianDate(firstStudent.tgl_penarikan || s.tglPenarikan || '30 April 2027'),
    '{tglSurat}': formatIndonesianDate(s.tglSurat || '06 Oktober 2026'),
    '{titimangsaTempat}': cleanFieldValue(s.titimangsaTempat, 'Klungkung'),
    '{noSurat}': s.noSurat || 'B.10.000/9546/SMKN1KLK/DIKPORA',
    '{guruNama}': cleanFieldValue(firstStudent.guru, '-'),
    '{guruNip}': cleanFieldValue(firstStudent.nip, '-'),
    '{guruPangkat}': cleanFieldValue(firstStudent.guru_pangkat || firstStudent.pangkat, '-'),
    '{guruJabatan}': cleanFieldValue(firstStudent.guru_jabatan || firstStudent.jabatan, 'Guru Pembimbing PKL'),
    '{tempatPkl}': firstStudent.tempat || 'Dunia Usaha / Dunia Industri',
    '{daftarTempatPkl}': daftarTempatHtml,
    '{alamatPkl}': cleanFieldValue(firstStudent.alamat, '-'),
    '{siswaNama}': cleanFieldValue(firstStudent.siswa, '-'),
    '{siswaNis}': cleanFieldValue(firstStudent.nis, '-'),
    '{siswaNisn}': cleanFieldValue(firstStudent.nisn, '-'),
    '{siswaNisNisn}': `${cleanFieldValue(firstStudent.nis, '-')}/${cleanFieldValue(firstStudent.nisn, '-')}`,
    '{tingkatKelas}': firstStudent.kelas ? firstStudent.kelas.split(' ')[0] : 'XII',
    '{jurusanPkl}': cleanFieldValue(firstStudent.jurusan, '-'),
    '{siswaJurusan}': cleanFieldValue(firstStudent.jurusan, '-'),
    '{kepsekNama}': s.kepsekNama || 'Sri Rejeki, S.Pd., M.Pd.',
    '{kepsekPangkat}': cleanFieldValue(s.kepsekPangkat, 'Pembina (IV/a)'),
    '{kepsekNip}': cleanFieldValue(s.kepsekNip, '19770309 200903 2 010'),
    '{tabelSiswaPermohonan}': tabelSiswaHtml
  };

  for (const k in varMap) {
    rawHtml = rawHtml.split(k).join(varMap[k]);
  }

  // 6. Area Tanda Tangan
  let ttdMediaHtml = '';
  if (AppState.showTtd) {
    ttdMediaHtml = buildTtdElektronikHtml(s);
  } else {
    const rawTtdBasah = s.ttdBasahUrl || DEFAULT_ASSET_URLS.ttd_basah;
    const ttdBasahSrc = getDirectImageUrl(rawTtdBasah, typeof ASSETS !== 'undefined' ? ASSETS.ttdBasah : '');
    ttdMediaHtml = `
      <div style="position: relative; height: 75px; margin: 0;">
        ${ttdBasahSrc ? `<img src="${ttdBasahSrc}" alt="TTD Basah" style="position: absolute; left: -75px; top: -52px; height: 140px; max-width: 250px; object-fit: contain; pointer-events: none; z-index: 2;">` : ''}
      </div>
    `;
  }

  const ttdBlockHtml = `
    <div style="width: 100%; display: flex; justify-content: flex-end; margin-top: 10px; page-break-inside: avoid;">
      <div style="width: 310px; max-width: 100%; text-align: left; position: relative;">
        <div>
          <div>Dikeluarkan di ${s.titimangsaTempat || 'Klungkung'}</div>
          <div>Pada Tanggal, ${formatIndonesianDate(s.tglSurat) || '16 November 2026'}</div>
        </div>
        <div style="margin-bottom: 2px;"><div>Kepala ${s.namaSekolah || 'SMK Negeri 1 Klungkung'}</div></div>
        ${ttdMediaHtml}
        ${AppState.showTtd ? '' : `
          <div style="font-weight: bold; text-decoration: underline; margin-top: 2px; position: relative; z-index: 3;">${s.kepsekNama || 'Sri Rejeki, S.Pd.,M.Pd.'}</div>
          <div style="font-size: 10pt; position: relative; z-index: 3;">${s.kepsekPangkat ? `<div>${s.kepsekPangkat}</div>` : ''}NIP. ${s.kepsekNip || '19770309 200903 2 010'}</div>
        `}
      </div>
    </div>
  `;

  return `
    <div class="surat-page">
      ${kopHtml}
      ${judulHtml}
      ${tujuanHtml}
      <div style="text-align: justify; line-height: 1.35; font-size: 11pt;">${rawHtml}</div>
      ${ttdBlockHtml}
    </div>
  `;
}

/**
 * Helper menghasilkan HTML Halaman 2 (Lampiran Daftar Siswa)
 */
function buildSingleLampiranHtml(studentList) {
  return `

// ================= PENGELOMPOKAN & EKSEKUSI CETAK MASSAL =================
function getBatchPrintGroups(scope) {
  const records = AppState.records || [];
  if (records.length === 0) return [];

  const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};
  const isIndividual = (activeTemplate.id === 'tpl_surat_keterangan_pkl' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('keterangan')));
  const isMonitoring = (activeTemplate.id === 'tpl_suket_monitoring_pkl' || (activeTemplate.nama && (activeTemplate.nama.toLowerCase().includes('monitoring') || activeTemplate.nama.toLowerCase().includes('tugas'))));

  if (scope === 'siswa' || isIndividual) {
    // 1 Berkas per Siswa
    return records.map(st => [st]);
  } else if (scope === 'current_filter') {
    // Sesuai filter layar aktif
    const active = getActiveFilteredStudents();
    return active.length > 0 ? [active] : [];
  } else if (isMonitoring) {
    // Khusus Surat Tugas Monitoring: Kelompokkan per Guru Pembimbing (1 guru membina beberapa tempat)
    const groups = {};
    records.forEach(r => {
      const g = (r.guru || 'Tanpa_Pembimbing').trim();
      if (!groups[g]) groups[g] = [];
      groups[g].push(r);
    });
    return Object.values(groups);
  } else {
    // Default / 'group': Kelompokkan per (Guru Pembimbing + Tempat DU/DI)
    const groups = {};
    records.forEach(r => {
      const g = (r.guru || 'Tanpa_Pembimbing').trim();
      const t = (r.tempat || 'Umum').trim();
      const key = g + '___' + t;
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    return Object.values(groups);
  }
}

function updateBatchPrintModalInfo() {
  const el = document.querySelector('input[name="batchScope"]:checked');
  const scope = el ? el.value : 'group';
  const groups = getBatchPrintGroups(scope);
  const badge = document.getElementById('batchPrintDocCount');
  if (badge) {
    const totalSiswa = groups.reduce((acc, curr) => acc + curr.length, 0);
    const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};
    const useLampiran = isTemplateUsingLampiran(activeTemplate, groups[0] || []);
    const totalLembar = useLampiran ? groups.length * 2 : groups.length;
    badge.textContent = `${groups.length} Dokumen / ${totalLembar} Lembar (${totalSiswa} Siswa)`;
  }
}

function openBatchPrintModal() {
  closeAllDropdowns();
  const modal = document.getElementById('batchPrintModal');

    modal.classList.remove('hidden');

  }
}

  }
