function executeBatchPrint() {
  const el = document.querySelector('input[name="batchScope"]:checked');
  const scope = el ? el.value : 'group';
  const groups = getBatchPrintGroups(scope);

  if (groups.length === 0) {
    showToast('Tidak ada data siswa untuk dicetak.', 'warning');
    return;
  }

  closeBatchPrintModal();
  const batchContainer = document.getElementById('batchPrintContainer');
  batchContainer.innerHTML = '';
  document.body.classList.add('batch-print-active');

  const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};

  groups.forEach((groupStudents) => {
    // Lembar 1: Halaman Surat Utama
    const pageSuratDiv = document.createElement('div');
    pageSuratDiv.className = `doc-page paper-${AppState.paperSize} batch-doc-page`;
    pageSuratDiv.innerHTML = buildSingleSuratHtml(groupStudents, activeTemplate, AppState.settings);
    batchContainer.appendChild(pageSuratDiv);

    // Lembar 2: Halaman Lampiran Daftar Siswa (jika template menggunakan lampiran)
    if (isTemplateUsingLampiran(activeTemplate, groupStudents)) {
      const pageLampiranDiv = document.createElement('div');
      pageLampiranDiv.className = `doc-page paper-${AppState.paperSize} batch-doc-page`;
      pageLampiranDiv.innerHTML = buildSingleLampiranHtml(groupStudents);
      batchContainer.appendChild(pageLampiranDiv);
    }
  });

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.body.classList.remove('batch-print-active');
      batchContainer.innerHTML = '';
    }, 1500);
  }, 400);
}

// ================= UNDUH MICROSOFT WORD (.DOC / .ZIP) =================
function downloadDocxClient() {
  const activeStudents = getActiveFilteredStudents();
  if (!activeStudents || activeStudents.length === 0) {
    showToast('Tidak ada data siswa untuk diunduh.', 'warning');
    return;
  }
  const firstStudent = activeStudents[0] || {};
  const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};
  const safeName = (firstStudent.guru || firstStudent.siswa || 'Dokumen').replace(/[^a-zA-Z0-9]/g, '_');
  const filename = `Surat_PKL_${safeName}.doc`;

  const wordHtml = buildWordHtml(activeStudents, activeTemplate, AppState.settings, filename);
  const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
  if (typeof saveAs !== 'undefined') {
    saveAs(blob, filename);
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  showToast(`Berkas Word "${filename}" berhasil diunduh!`, 'success');
}

function downloadAllWordZip() {
  if (typeof JSZip === 'undefined') {
    showToast('Library JSZip belum siap, silakan coba beberapa saat lagi.', 'warning');
    return;
  }
  const records = AppState.records || [];
  if (records.length === 0) {
    showToast('Tidak ada data siswa di database untuk diunduh.', 'warning');
    return;
  }

  const activeTemplate = AppState.templates.find(t => t.id === AppState.activeTemplateId) || AppState.templates[0] || {};
  const isIndividual = (activeTemplate.id === 'tpl_surat_keterangan_pkl' || (activeTemplate.nama && activeTemplate.nama.toLowerCase().includes('keterangan')));
  const isMonitoring = (activeTemplate.id === 'tpl_suket_monitoring_pkl' || (activeTemplate.nama && (activeTemplate.nama.toLowerCase().includes('monitoring') || activeTemplate.nama.toLowerCase().includes('tugas'))));

  showToast('Menyiapkan berkas Word ke dalam arsip ZIP...', 'info');

  const zip = new JSZip();
  let count = 0;

  if (isIndividual) {
    // 1 Berkas per Siswa
    records.forEach((st, idx) => {
      const safeSiswa = (st.siswa || `Siswa_${idx + 1}`).replace(/[^a-zA-Z0-9]/g, '_');
      const filename = `${String(idx + 1).padStart(2, '0')}_Surat_PKL_${safeSiswa}.doc`;
      const wordHtml = buildWordHtml([st], activeTemplate, AppState.settings, filename);
      zip.file(filename, '\ufeff' + wordHtml);
      count++;
    });
  } else if (isMonitoring) {
    // Kelompokkan per Guru Pembimbing (Surat Tugas Monitoring)
    const groups = {};
    records.forEach(r => {
      const g = (r.guru || 'Tanpa_Pembimbing').trim();
      if (!groups[g]) groups[g] = [];
      groups[g].push(r);
    });

    let gIdx = 1;
    for (const guruName in groups) {
      const groupStudents = groups[guruName];
      const safeGuru = guruName.replace(/[^a-zA-Z0-9]/g, '_');
      const filename = `${String(gIdx).padStart(2, '0')}_Suket_Monitoring_${safeGuru}.doc`;
      const wordHtml = buildWordHtml(groupStudents, activeTemplate, AppState.settings, filename);
      zip.file(filename, '\ufeff' + wordHtml);
      count++;
      gIdx++;
    }
  } else {
    // Kelompokkan per (Guru Pembimbing + Tempat DU/DI)
    const groups = {};
    records.forEach(r => {
      const g = (r.guru || 'Tanpa_Pembimbing').trim();
      const t = (r.tempat || 'Umum').trim();
      const key = g + '___' + t;
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });

    let gIdx = 1;
    for (const key in groups) {
      const groupStudents = groups[key];
      const first = groupStudents[0];
      const safeGuru = (first.guru || 'Guru').replace(/[^a-zA-Z0-9]/g, '_');
      const safeTempat = (first.tempat || 'DUDI').replace(/[^a-zA-Z0-9]/g, '_');
      const filename = `${String(gIdx).padStart(2, '0')}_Surat_PKL_${safeGuru}_${safeTempat}.doc`;
      const wordHtml = buildWordHtml(groupStudents, activeTemplate, AppState.settings, filename);
      zip.file(filename, '\ufeff' + wordHtml);
      count++;
      gIdx++;
    }
  }

  zip.generateAsync({ type: 'blob' }).then(function(content) {
    const zipName = `Semua_Surat_PKL_Word_${Date.now()}.zip`;
    if (typeof saveAs !== 'undefined') {
      saveAs(content, zipName);
    } else {
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = zipName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    showToast(`Berhasil mengunduh ${count} berkas Word dalam arsip ZIP!`, 'success');
  }).catch(function(err) {
    showToast('Gagal membuat berkas ZIP: ' + err.message, 'error');
  });
}

// Dropdown Helper dengan proteksi Stop Propagation & Mobile Support
function toggleDropdown(menuId, event) {
  if (event) {
    if (typeof event.stopPropagation === 'function') event.stopPropagation();
    if (typeof event.preventDefault === 'function') event.preventDefault();
  }
  const menu = document.getElementById(menuId);
  if (!menu) return;
  const isHidden = menu.classList.contains('hidden');
  closeAllDropdowns();
  if (isHidden) {
    menu.classList.remove('hidden');
  }
}

function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-menu-list').forEach(el => el.classList.add('hidden'));
}

document.addEventListener('click', function(e) {
  if (e && e.target) {
    const isInsideCetak = e.target.closest && e.target.closest('#dropdownCetakWrapper');
    const isInsideUnduh = e.target.closest && e.target.closest('#dropdownUnduhWrapper');
    if (isInsideCetak || isInsideUnduh) {
      return;
    }
  }
  closeAllDropdowns();
});

// ==========================================
// SIDEBAR ACCORDION & DRAWER CONTROLLER
// Mekanisme Accordion: membuka satu panel dan menutup panel sebelumnya otomatis
// ==========================================
function toggleSidebarAccordion(sectionId) {
  const sections = ['pemilihan', 'template', 'jadwal', 'opsi'];
  const targetBody = document.getElementById('accordionBody_' + sectionId);
  const targetChevron = document.getElementById('accordionChevron_' + sectionId);
  const targetHeader = document.getElementById('accordionHeader_' + sectionId);
  if (!targetBody) return;

  const isCurrentlyOpen = !targetBody.classList.contains('hidden');

  // Tutup seluruh panel lain secara otomatis
  sections.forEach(id => {
    const body = document.getElementById('accordionBody_' + id);
    const chevron = document.getElementById('accordionChevron_' + id);
    const header = document.getElementById('accordionHeader_' + id);
    if (body) body.classList.add('hidden');
    if (chevron) chevron.classList.remove('rotate-180');
    if (header) {
      header.classList.remove('border-b', 'border-slate-100', 'bg-indigo-50/40');
    }
  });

  // Jika sebelumnya tertutup, buka panel ini
  if (!isCurrentlyOpen) {
    targetBody.classList.remove('hidden');
    if (targetChevron) targetChevron.classList.add('rotate-180');
    if (targetHeader) {
      targetHeader.classList.add('border-b', 'border-slate-100', 'bg-indigo-50/40');
    }
  }

  if (window.lucide) lucide.createIcons();
}

function toggleSidebarDrawer() {
  const sidebar = document.getElementById('sidebarControls');
  const icon = document.getElementById('btnToggleSidebarIcon');
  const text = document.getElementById('btnToggleSidebarText');
  if (!sidebar) return;

  const isHidden = sidebar.classList.contains('hidden');
  if (isHidden) {
    sidebar.classList.remove('hidden');
    if (icon) icon.setAttribute('data-lucide', 'panel-left-close');
    if (text) text.textContent = 'Tutup Panel';
  } else {
    sidebar.classList.add('hidden');
    if (icon) icon.setAttribute('data-lucide', 'panel-left-open');
    if (text) text.textContent = 'Buka Panel';
  }
  if (window.lucide) lucide.createIcons();

  if (AppState.isDocFitActive) {
    setTimeout(applyDocFitScale, 300);
  }
}

/**
 * Fit to Screen / Zoom Dokumen Khusus Tampilan Mobile & Layar Terbatas
 */
function toggleDocFitMobile(forceState) {
  if (typeof forceState === 'boolean') {
    AppState.isDocFitActive = forceState;
  } else {
    AppState.isDocFitActive = !AppState.isDocFitActive;
  }
  applyDocFitScale();
}

function applyDocFitScale() {
  const doc = document.getElementById('documentTemplate');
  const viewport = document.getElementById('docScaleViewport');
  const btn = document.getElementById('btnToggleDocFit');
  const icon = document.getElementById('btnDocFitIcon');
  const text = document.getElementById('btnDocFitText');
  const previewArea = document.getElementById('mainDocumentPreviewArea');
  
  if (!doc) return;

  if (AppState.isDocFitActive) {
    const containerWidth = previewArea ? previewArea.clientWidth : window.innerWidth;
    // Beri ruang margin kiri-kanan (total 16px) agar dokumen rapi di tengah
    const availableWidth = Math.max(280, Math.min(containerWidth - 16, window.innerWidth - 16));
    const originalWidth = doc.offsetWidth || 813;
    const originalHeight = doc.offsetHeight || 1200;

    const scale = availableWidth < originalWidth ? (availableWidth / originalWidth) : 1;

    if (scale < 0.999) {
      const scaledWidth = Math.floor(originalWidth * scale);
      const scaledHeight = Math.ceil(originalHeight * scale);

      if (viewport) {
        viewport.style.width = scaledWidth + 'px';
        viewport.style.height = scaledHeight + 'px';
        viewport.style.overflow = 'hidden';
        viewport.style.margin = '0 auto';
        viewport.style.position = 'relative';
      }

      doc.style.transformOrigin = 'top left';
      doc.style.transform = 'scale(' + scale + ')';
    } else {
      if (viewport) {
        viewport.style.width = '';
        viewport.style.height = '';
        viewport.style.overflow = '';
        viewport.style.margin = '';
        viewport.style.position = '';
      }
      doc.style.transform = 'none';
      doc.style.transformOrigin = '';
    }

    if (btn) {
      btn.className = 'px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs flex items-center gap-1.5 transition border border-indigo-700 shadow-xs cursor-pointer';
      btn.title = 'Kembalikan ukuran dokumen ke 100% normal';
    }
    if (icon) icon.setAttribute('data-lucide', 'zoom-in');
    if (text) text.textContent = '100%';
  } else {
    // Mode Normal 100%
    if (viewport) {
      viewport.style.width = '';
      viewport.style.height = '';
      viewport.style.overflow = '';
      viewport.style.margin = '';
      viewport.style.position = '';
    }
    doc.style.transform = 'none';
    doc.style.transformOrigin = '';

    if (btn) {
      btn.className = 'px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-lg text-xs flex items-center gap-1.5 transition border border-indigo-200 shadow-2xs cursor-pointer';
      btn.title = 'Sesuaikan lebar dokumen pas dengan layar (Fit to Screen)';
    }
    if (icon) icon.setAttribute('data-lucide', 'scan');
    if (text) text.textContent = 'Fit Layar';
  }

  if (window.lucide) lucide.createIcons();
}

let resizeDocFitTimer = null;
window.addEventListener('resize', function() {
  if (AppState.isDocFitActive) {
    clearTimeout(resizeDocFitTimer);
    resizeDocFitTimer = setTimeout(function() {
      applyDocFitScale();
    }, 150);
  }
});

// ==========================================
// MULTI-PAGE ROUTING & NAVIGATION ENGINE
// Sesuai Spesifikasi Teknik pembuatan.md (Scriptlet Pattern)
// ==========================================

function getAppUrl() {
  if (AppState.webAppUrl && AppState.webAppUrl.trim()) return AppState.webAppUrl.trim();
  try {
    if (typeof APP_URL !== 'undefined' && APP_URL) return APP_URL;
  } catch(e) {}
  return window.location.href.split('?')[0];
}

function getCurrentPage() {
  try {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('page');
    if (p) return p.toLowerCase().trim();
  } catch(e) {}
  
  if (window._serverActivePage) return window._serverActivePage.toLowerCase().trim();
  
  const saved = sessionStorage.getItem('surat_pkl_active_page') || localStorage.getItem('surat_pkl_active_page');
  if (saved) return saved.toLowerCase().trim();

  if (document.getElementById('dbTableBody') && !document.getElementById('documentTemplate')) return 'database';
  if (document.getElementById('wysiwygEditor') && !document.getElementById('documentTemplate')) return 'template';
  if (document.getElementById('settingNamaSekolah') && !document.getElementById('documentTemplate')) return 'pengaturan';
  return 'surat';
}

function navigateTo(page, params) {
  sessionStorage.setItem('surat_pkl_active_page', page);
  localStorage.setItem('surat_pkl_active_page', page);

  // Jika sedang berjalan di file lokal (preview_local.html)
  if (window.location.protocol === 'file:' || window.isLocalPreview) {
    if (typeof switchLocalPage === 'function') {
      switchLocalPage(page, params);
      return;
    }
  }

  let baseUrl = getAppUrl();
  let url = baseUrl + '?page=' + encodeURIComponent(page);
  if (params && typeof params === 'object') {
    for (let k in params) {
      if (params.hasOwnProperty(k)) {
        url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }
    }
  }

  // Mengarahkan jendela induk (window.top) untuk menghindari blank putih akibat sandbox iframe GAS
  try {
    if (window.top && window.top !== window) {
      window.top.location.href = url;
      return;
    }
  } catch (e) {}

  window.location.href = url;
}

function highlightActiveNavigation() {
  const page = getCurrentPage();

  const navTabs = [
    { id: 'navTabSurat', mobileId: 'mobileNavSurat', key: 'surat', activeClass: 'bg-indigo-600 text-white shadow-xs font-bold' },
    { id: 'navTabDatabase', mobileId: 'mobileNavDatabase', key: 'database', activeClass: 'bg-sky-600 text-white shadow-xs font-bold' },
    { id: 'navTabTemplate', mobileId: 'mobileNavTemplate', key: 'template', activeClass: 'bg-amber-600 text-white shadow-xs font-bold' },
    { id: 'navTabPengaturan', mobileId: 'mobileNavPengaturan', key: 'pengaturan', activeClass: 'bg-violet-600 text-white shadow-xs font-bold' }
  ];

  navTabs.forEach(item => {
    const tabEl = document.getElementById(item.id);
    const mobEl = document.getElementById(item.mobileId);
    const isActive = (item.key === page) || (item.key === 'surat' && (page === 'dashboard' || !page));

    if (tabEl) {
      if (isActive) {
        tabEl.className = 'nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ' + item.activeClass;
      } else {
        tabEl.className = 'nav-page-tab inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-300 hover:text-white hover:bg-white/10';
      }
    }

    if (mobEl) {
      if (isActive) {
        mobEl.classList.remove('text-slate-400');
        mobEl.classList.add('text-indigo-400', 'font-bold');
      } else {
        mobEl.classList.remove('text-indigo-400', 'font-bold');
        mobEl.classList.add('text-slate-400');
      }
    }
  });
}

function switchLocalPage(page, params) {
  const views = {
    'surat': document.getElementById('viewPageSurat'),
    'database': document.getElementById('viewPageDatabase'),
    'template': document.getElementById('viewPageTemplate'),
    'pengaturan': document.getElementById('viewPagePengaturan')
  };

  const targetKey = (page === 'dashboard' || !page) ? 'surat' : page;

  Object.keys(views).forEach(k => {
    const el = views[k];
    if (el) {
      el.classList.toggle('hidden', k !== targetKey);
    }
  });

  window._serverActivePage = targetKey;
  highlightActiveNavigation();

  if (targetKey === 'database') {
    renderDbTable();
  } else if (targetKey === 'template') {
    populateEditorTemplateSelect();
    const tab = (params && params.tab) ? params.tab : 'editor';
    switchTemplateTab(tab);
    loadTemplateToEditor(AppState.editingTemplateId || AppState.activeTemplateId);
  } else if (targetKey === 'pengaturan') {
    populateSettingsInputs();
  } else {
    renderSidebarControls();
    renderDocumentPreview();
  }

  if (window.lucide) lucide.createIcons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
